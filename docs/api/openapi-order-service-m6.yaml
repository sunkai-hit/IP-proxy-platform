openapi: 3.1.2
info:
  title: IP代理管理平台 M6 订单与服务 API
  version: 1.0.0
  description: |
    M6 实际实现契约。订单只表达客户购买关系；资源绑定、凭证生成和独享占用仅在服务开通阶段产生。
    VPN/隧道实际数据面通过 ServiceProvisionAdapter 对接，正式环境未配置适配器时不伪造开通成功。
servers:
  - url: http://localhost:8080/api/admin/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    OrderItemInput:
      type: object
      required: [productId]
      properties:
        productId: { type: integer, format: int64 }
        packageId: { type: [integer, 'null'], format: int64 }
        quantity: { type: integer, minimum: 1, default: 1 }
        serviceCount: { type: integer, minimum: 1, default: 1 }
        unitPrice: { type: [number, 'null'] }
        remark: { type: string }
    OrderInput:
      type: object
      required: [customerId, items]
      properties:
        customerId: { type: integer, format: int64 }
        orderType: { type: string, enum: [NEW, RENEW, EXPAND, CHANGE] }
        currency: { type: string, default: CNY }
        expectedEffectiveAt: { type: [string, 'null'], format: date-time }
        expectedExpireAt: { type: [string, 'null'], format: date-time }
        ownerUserId: { type: [integer, 'null'], format: int64 }
        remark: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OrderItemInput' }
    ManualProvisionInput:
      type: object
      required: [customerId, productId]
      properties:
        customerId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        packageId: { type: [integer, 'null'], format: int64 }
        strategyId: { type: [integer, 'null'], format: int64 }
        effectiveAt: { type: [string, 'null'], format: date-time }
        expireAt: { type: [string, 'null'], format: date-time }
        remark: { type: string }
    RenewRequest:
      type: object
      required: [days, reason]
      properties:
        days: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }
    WhitelistRequest:
      type: object
      required: [ipAddress]
      properties:
        ipAddress: { type: string }
        remark: { type: string }
paths:
  /orders:
    get:
      tags: [Order]
      summary: 订单分页列表
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
      responses: { '200': { description: OK } }
    post:
      tags: [Order]
      summary: 创建订单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses: { '200': { description: OK } }
  /orders/{id}:
    get:
      tags: [Order]
      summary: 订单详情及订单项
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /orders/{id}/confirm:
    post:
      tags: [Order]
      summary: 确认订单，进入待开通
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /orders/{id}/cancel:
    post:
      tags: [Order]
      summary: 取消未开通订单
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /orders/{id}/provision:
    post:
      tags: [Order]
      summary: 按订单项生成服务实例
      description: 固化产品/套餐/策略快照，绑定资源并生成一次性返回的服务凭证。
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /services:
    get:
      tags: [Service]
      summary: 服务实例分页列表
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: integer, format: int64 } }
        - { name: productType, in: query, schema: { type: string, enum: [SHORT_IP, LONG_IP, EXCLUSIVE_IP, VPN, TUNNEL] } }
      responses: { '200': { description: OK } }
  /services/provision:
    post:
      tags: [Service]
      summary: 无订单直接开通服务
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ManualProvisionInput' } } } }
      responses: { '200': { description: OK } }
  /services/{id}:
    get:
      tags: [Service]
      summary: 服务详情
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /services/{id}/suspend:
    post:
      tags: [ServiceLifecycle]
      summary: 暂停服务并冻结凭证
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /services/{id}/resume:
    post:
      tags: [ServiceLifecycle]
      summary: 恢复暂停服务
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /services/{id}/renew:
    post:
      tags: [ServiceLifecycle]
      summary: 服务续费
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenewRequest' } } } }
      responses: { '200': { description: OK } }
  /services/{id}/terminate:
    post:
      tags: [ServiceLifecycle]
      summary: 终止服务并执行资源释放
      description: 数据面释放成功后撤销凭证、释放资源绑定；独享资源进入 PENDING_RECYCLE。
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /services/{id}/credentials:
    get:
      tags: [Credential]
      summary: 查询服务凭证掩码
      description: 不返回 secret_hash、密文或明文。
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /services/{id}/credentials/reset:
    post:
      tags: [Credential]
      summary: 重置服务凭证
      description: 新密钥仅在本次响应返回一次，数据库仅保存哈希和掩码。
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } } } }
      responses: { '200': { description: OK } }
  /services/{id}/resource-bindings:
    get:
      tags: [Service]
      summary: 服务资源绑定
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /services/{id}/changes:
    get:
      tags: [Service]
      summary: 服务变更记录
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
  /services/{id}/whitelist:
    get:
      tags: [Whitelist]
      summary: 服务白名单
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses: { '200': { description: OK } }
    post:
      tags: [Whitelist]
      summary: 新增服务白名单
      parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WhitelistRequest' } } } }
      responses: { '200': { description: OK } }
  /services/{id}/whitelist/{wid}:
    delete:
      tags: [Whitelist]
      summary: 停用白名单
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: wid, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: reason, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
  /service-releases:
    get:
      tags: [Release]
      summary: 服务释放记录
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
