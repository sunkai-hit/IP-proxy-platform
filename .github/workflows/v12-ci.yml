name: V1.3 Consolidation CI

on:
  push:
    branches: [main, feature/v1.2-full-upgrade, feature/v1.2-round3-unified-baseline-20261014]
  pull_request:
    branches: [main, feature/v1.2-full-upgrade, feature/v1.2-round3-unified-baseline-20261014]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Chromium for real browser E2E against management backend
        working-directory: frontend
        run: |
          npm install --no-package-lock
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify V1.3 uploaded baseline and cross-artifact file coverage
        run: python3 scripts/ci_v13_baseline_gate.py
      - name: Verify 31-item cross-team interface index and report DOCX internal version drift
        run: python3 scripts/ci_v13_release_evidence_gate.py
      - name: Verify A-EXIT 54 human evidence rows and anti-fake-signoff gate
        run: |
          python3 -m unittest discover -s scripts -p 'test_ci_v13_a_exit_ledger_gate.py'
          python3 -m unittest discover -s scripts -p 'test_ci_v13_a_exit_evidence_export.py'
          python3 scripts/ci_v13_a_exit_ledger_gate.py
      - name: Verify V1.3 frontend/backend API routes and lifecycle RBAC
        run: python3 scripts/ci_v13_api_contract_gate.py
      - name: Verify V1.3 cross-page router, payment-selection and RBAC guards
        run: python3 scripts/ci_v13_ui_workflow_gate.py
      - name: Verify short-IP allocation guard
        run: mvn -B -Dtest=OpenApiMapperGuardTest,OpenApiLegacyExtractionGateTest,V12ServiceQueryFilterTest,BuiltinResourcePolicyTest,ProductAuthorizationServiceTest,ProductAuthorizationSecurityTest,V12ProvisionSafetyTest,ProductGroupReadClientTest,ProductGroupReadControllerTest,ProductTaskReconcilerTest,ProductExpiryStopDispatcherTest,ProductGroupStopClientTest,ProductExpiryStopCommitterTest,ProductGraceReleaseInspectorTest,ProductGraceReleaseControllerTest,ProductGraceReleaseFlowTest,LongMonitorServiceTest,ProductGroupHttpWireTest,OrderServiceCredentialVisibilityTest,CustomerDetailVisibilityTest,CustomerAuthReadRedactionTest test
        working-directory: backend
      - name: Package backend
        run: mvn -B -DskipTests package
        working-directory: backend
      - name: Boot and exercise V1.3 baseline against existing business flows
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-v12-key-abcdefghijklmnopqrstuvwxyz-123456
          M1_ADMIN_PASSWORD: admin123
          SPRING_PROFILES_ACTIVE: m4-mock,m6-mock,m8-mock
          MONITOR_SCHEDULED_ENABLED: 'false'
          STATISTICS_SCHEDULED_ENABLED: 'false'
        run: |
          set -euo pipefail
          java -jar backend/target/ip-proxy-platform-backend.jar >/tmp/backend.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://localhost:8080/actuator/health >/dev/null && break || sleep 2; done
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["accessToken"])' <<< "$LOGIN")
          # Product-group authorization endpoint stays closed when no integration
          # key is configured, even if a caller knows customer/service IDs.
          PRODUCT_AUTH_CODE=$(curl -s -o /tmp/product-auth-denied.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"subjectId":"1","serviceId":"1","action":"SHORT_EXTRACT","requestedUnits":1,"requestId":"ci-deny"}' \
            http://localhost:8080/business/v1/authorizations/check)
          echo "Product authorization default-off HTTP status: $PRODUCT_AUTH_CODE"
          if [ "$PRODUCT_AUTH_CODE" != "403" ]; then
            cat /tmp/product-auth-denied.json || true
            exit 1
          fi
          echo 'Product authorization endpoint defaults closed (HTTP 403)'

          H="Authorization: Bearer $TOKEN"
          J='Content-Type: application/json'
          # The product write path MUST be unavailable in the default CI profile.
          # No service may be paused or released by accident without a
          # deliberately enabled, independently signed-off product integration.
          STOP_HTTP=$(curl -s -o /tmp/r3-write-disabled.json -w '%{http_code}' -X POST \
            -H "$H" -H "$J" http://localhost:8080/api/admin/v1/v12/delivery-actions/unknown-op/dispatch-expiry-stop)
          test "$STOP_HTTP" = "400"
          python3 -c 'import json; d=json.load(open("/tmp/r3-write-disabled.json")); assert d["code"]=="PRODUCT_WRITE_DISABLED"'
          # No outbound product-group endpoint is configured in this synthetic
          # environment. The management UI must show that fact and fail closed.
          GATEWAY=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/product-integration/status)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["configured"] is False and d["readOnly"] is True and d["writesEnabled"] is False' <<< "$GATEWAY"
          # Production default: the legacy res_ip snapshot API must not distribute
          # synthetic/possibly stale proxy IPs, even in a management Mock profile.
          SHORT_EXTRACT_CODE=$(curl -s -o /tmp/legacy-short-extract-denied.json -w '%{http_code}' \
            'http://localhost:8080/api/open/v1/proxy/extract?amount=1')
          test "$SHORT_EXTRACT_CODE" = "400"
          python3 -c 'import json; d=json.load(open("/tmp/legacy-short-extract-denied.json")); assert d["code"]=="OPEN_REAL_SHORT_POOL_NOT_CONNECTED", d'
          echo 'Unverified legacy short-IP extract stays disabled even with CI mock business data'
          POOL_HTTP_CODE=$(curl -s -o /tmp/product-pool-unavailable.json -w '%{http_code}' -H "$H" http://localhost:8080/api/admin/v1/v12/product-integration/short-pool)
          test "$POOL_HTTP_CODE" = "400"
          python3 -c 'import json; d=json.load(open("/tmp/product-pool-unavailable.json")); assert d["code"]=="PRODUCT_INTEGRATION_NOT_CONFIGURED"'

          C=$(curl -fsS -H "$H" -H "$J" -d '{"customerName":"V12 CI Customer","customerTypeCode":"ENTERPRISE","contactName":"CI","contactPhone":"13800000000"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")
          for P in centos ros lines; do curl -fsS -H "$H" -H "$J" -d '{"reason":"V12 CI sync"}' http://localhost:8080/api/admin/v1/resources/$P/sync >/dev/null; done
          LINES=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/v12/resources/lines?page=1&size=20')
          L1=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]>=2; print(d["items"][0]["id"])' <<< "$LINES")
          L2=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["items"][1]["id"])' <<< "$LINES")
          POOL=$(curl -fsS -H "$H" -H "$J" -d "{\"poolCode\":\"CI-V12-SHARED\",\"poolName\":\"V12 Shared Pool\",\"poolType\":\"SHARED\",\"purpose\":\"CI\",\"regionCodes\":[],\"carrierCodes\":[],\"lineIds\":[$L1,$L2]}" http://localhost:8080/api/admin/v1/v12/resource-pools)
          POOLID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$POOL")
          MEMBERS=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/resource-pools/$POOLID/lines)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["total"]==2' <<< "$MEMBERS"

          PROD=$(curl -fsS -H "$H" -H "$J" -d '{"productCode":"CI-V12-SHORT","productName":"V12 Short IP","productType":"SHORT_IP","accessModeCode":"API_EXTRACT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"typeConfig":{"ipValidSeconds":60,"singleExtractLimit":10,"extractRateLimit":100,"extractRateWindowSeconds":60,"dedupPeriodSeconds":300,"whitelistRequired":true,"switchPolicy":{"mode":"BUILTIN"}}}' http://localhost:8080/api/admin/v1/products)
          PID2=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PROD")
          curl -fsS -H "$H" -H "$J" -d '{"reason":"V12 CI enable"}' http://localhost:8080/api/admin/v1/v12/products/$PID2/enable >/dev/null
          PKG=$(curl -fsS -H "$H" -H "$J" -d "{\"packageCode\":\"CI-V12-PKG\",\"productId\":$PID2,\"packageName\":\"V12 Package\",\"serviceDays\":30,\"extractQuota\":10000,\"price\":100,\"currency\":\"CNY\",\"quotaConfig\":{}}" http://localhost:8080/api/admin/v1/packages)
          PKGID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PKG")
          SVC=$(curl -fsS -H "$H" -H "$J" -d "{\"customerId\":$CID,\"productId\":$PID2,\"packageId\":$PKGID,\"deliveryMode\":\"SELF_OWNED\",\"remark\":\"CI\"}" http://localhost:8080/api/admin/v1/services/provision)
          SID=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="ACTIVE" and d["deliveryMode"]=="SELF_OWNED"; print(d["serviceId"])' <<< "$SVC")
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/services/$SID >/dev/null
          CUSTOMER_ROWS=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/customers?page=1&size=20")
          python3 -c 'import json,sys; rows=json.load(sys.stdin)["data"]["items"]; c=next(v for v in rows if v["id"]==int(sys.argv[1])); assert c["service_count"]>=1 and "next_expire_at" in c and "grace_pending_count" in c' "$CID" <<< "$CUSTOMER_ROWS"
          echo 'UI-02 customer list includes service counts, next expiry and grace pending fields'

          # R3 read-model and contract smoke; this remains Mock-only, not genuine proxy delivery.
          SUMMARY=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/services/$SID/delivery-summary)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["serviceId"]>0 and d["deliveryStage"] in ("MANAGEMENT_ONLY","MOCK_ONLY","ADAPTER_ACK_UNVERIFIED"); assert d["dataSource"]=="MANAGEMENT_DB_UNVERIFIED"' <<< "$SUMMARY"
          CLAIMS=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/services/$SID/egress-claims)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]==[]' <<< "$CLAIMS"
          GRACE=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/packages/$PKGID/grace)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["packageId"]>0 and d["graceDays"] is None' <<< "$GRACE"
          # Lifecycle operations must not silently claim success against Mock-only adapters.
          STOP_CODE=$(curl -s -o /tmp/r3-mock-stop.json -w '%{http_code}' -H "$H" -H "$J" -d '{"reason":"R3 mock pause must be blocked"}' http://localhost:8080/api/admin/v1/services/$SID/suspend)
          test "$STOP_CODE" -ge 400
          AFTER_BLOCK=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/services/$SID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="ACTIVE"' <<< "$AFTER_BLOCK"
          echo 'R3 mocked lifecycle safe gate verified'
          echo 'R3 API read model / grace contract smoke passed (Mock only)'

          # R3 synthetic fixed-service fixtures exercise the safe planner ONLY.
          # They do not represent true LONG_IP network delivery or real entitlement migration.
          PGID=$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | sed -n '1p')
          test -n "$PGID"
          # Original resource chain UI acceptance: a line belongs to one ROS and
          # through it one CentOS; source pools are N:M, not current-IP ownership.
          LINE_RECORD=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/resources/lines/$L1")
          LIST_RECORD=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/resources/lines?page=1&size=20")
          python3 -c 'import json,sys; l=json.loads(sys.argv[1])["data"]; rows=json.loads(sys.argv[2])["data"]["items"]; assert "broadband_account" not in l and "broadband_account_mask" in l and all("broadband_account" not in x for x in rows)' "$LINE_RECORD" "$LIST_RECORD"
          R3_ROSID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["ros_id"])' <<< "$LINE_RECORD")
          R3_CENTOSID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["centos_id"])' <<< "$LINE_RECORD")
          ROS_RECORD=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/resources/ros/$R3_ROSID")
          CENTOS_RECORD=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/resources/centos/$R3_CENTOSID")
          python3 -c 'import json,sys; r=json.loads(sys.argv[1])["data"]; c=json.loads(sys.argv[2])["data"]; assert r["centos_id"]==int(sys.argv[3]) and c["ros"]["id"]==r["id"]' "$ROS_RECORD" "$CENTOS_RECORD" "$R3_CENTOSID"
          SECOND_POOL=$(curl -fsS -H "$H" -H "$J" -d "{\"poolCode\":\"CI-V12-SECOND\",\"poolName\":\"CI N:M Another Pool\",\"lineIds\":[$L1]}" http://localhost:8080/api/admin/v1/v12/resource-pools)
          SECOND_POOL_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$SECOND_POOL")
          R3_POOL_LIST=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/lines/$L1/pools")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]["items"]; assert len(x)==2 and len(set(r["id"] for r in x))==2' <<< "$R3_POOL_LIST"
          ACTIVE_POOL_BINDING=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_resource_binding WHERE service_id=$SID AND resource_type='POOL' AND resource_id=$POOLID AND status='ACTIVE'")
          test "$ACTIVE_POOL_BINDING" -gt 0
          POOL_REMOVE_HTTP=$(curl -s -o /tmp/r3-pool-last-source.json -w '%{http_code}' -H "$H" -H "$J" -d "{\"lineIds\":[$L1,$L2],\"reason\":\"CI fail closed for active service source\"}" "http://localhost:8080/api/admin/v1/v12/resource-pools/$POOLID/lines/remove")
          test "$POOL_REMOVE_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/r3-pool-last-source.json"))["code"]=="POOL_LAST_SOURCE_IN_USE"'
          UNCHANGED_POOL_LINES=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM res_pool_line WHERE pool_id=$POOLID AND enabled=TRUE")
          test "$UNCHANGED_POOL_LINES" -eq 2
          echo 'CentOS/ROS/line linkage, server-masked broadband account, N:M pool and in-use source protection verified'
          # Synthetic same-customer second service must NOT reuse an exclusive
          # contracted IPv4 even if the source line is the same. No real IP is allocated.
          for INDEX in A B; do
            docker exec "$PGID" psql -U ipproxy -d ip_proxy -v ON_ERROR_STOP=1 -c "
              INSERT INTO svc_instance(service_no,customer_id,product_id,package_id,
                product_type,product_snapshot,package_snapshot,quota_snapshot,
                effective_at,expire_at,status,delivery_stage)
              SELECT 'CI-EXCLUSIVE-RES-$INDEX',customer_id,product_id,package_id,
                'EXCLUSIVE_IP',product_snapshot,package_snapshot,quota_snapshot,
                now(),now()+interval '30 days','ACTIVE','MOCK_ONLY'
              FROM svc_instance WHERE id=$SID" >/dev/null
          done
          EX_CI_A=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT id FROM svc_instance WHERE service_no='CI-EXCLUSIVE-RES-A'")
          EX_CI_B=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT id FROM svc_instance WHERE service_no='CI-EXCLUSIVE-RES-B'")
          docker exec "$PGID" psql -U ipproxy -d ip_proxy -v ON_ERROR_STOP=1 -c "INSERT INTO svc_egress_claim(service_id,customer_id,source_line_id,egress_ipv4,claim_mode,claim_status) VALUES($EX_CI_A,$CID,$L1,'198.51.100.42','EXCLUSIVE','RESERVED')" >/dev/null
          if docker exec "$PGID" psql -U ipproxy -d ip_proxy -v ON_ERROR_STOP=1 -c "INSERT INTO svc_egress_claim(service_id,customer_id,source_line_id,egress_ipv4,claim_mode,claim_status) VALUES($EX_CI_B,$CID,$L1,'198.51.100.42','EXCLUSIVE','RESERVED')" >/tmp/r3-exclusive-conflict.log 2>&1; then
            echo 'Exclusive IPv4 conflict was wrongly accepted' >&2
            exit 1
          fi
          test "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_egress_claim WHERE egress_ipv4='198.51.100.42'::inet AND claim_status<>'RELEASED'")" -eq 1
          echo 'Same-customer different-service exclusive IPv4 collision rejected without extra claim'


          docker exec "$PGID" psql -U ipproxy -d ip_proxy -v ON_ERROR_STOP=1 -c "
            INSERT INTO svc_instance(
              service_no,customer_id,product_id,package_id,product_type,
              product_snapshot,package_snapshot,quota_snapshot,
              effective_at,expire_at,status,grace_days_snapshot,grace_until_at,
              expiry_phase,delivery_stage
            )
            SELECT 'CI-R3-EXP-'||s.id||'-'||v.grace, s.customer_id,s.product_id,s.package_id,
                   'LONG_IP',s.product_snapshot,s.package_snapshot,s.quota_snapshot,
                   now()-interval '5 days',now()-interval '2 days','ACTIVE',v.grace,
                   now()-interval '2 days'+v.grace*interval '1 day','NONE','MOCK_ONLY'
            FROM svc_instance s CROSS JOIN (VALUES (0),(3)) v(grace) WHERE s.id=$SID
          "
          EXP0=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT id FROM svc_instance WHERE service_no='CI-R3-EXP-$SID-0'")
          EXP3=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT id FROM svc_instance WHERE service_no='CI-R3-EXP-$SID-3'")
          test -n "$EXP0" && test -n "$EXP3"
          SCAN=$(curl -fsS -H "$H" -H "$J" -d '{"limit":200,"reason":"CI deterministic expiry scan"}' http://localhost:8080/api/admin/v1/v12/service-expiry/reconcile)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["realActionsExecuted"]==0 and d["created"]+d["existing"]>=2' <<< "$SCAN"
          SECOND=$(curl -fsS -H "$H" -H "$J" -d '{"limit":200,"reason":"CI repeated expiry scan"}' http://localhost:8080/api/admin/v1/v12/service-expiry/reconcile)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["created"]==0 and d["existing"]>=2 and not d["dataPlaneVerified"]' <<< "$SECOND"
          TASK_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_action_task WHERE service_id IN ($EXP0,$EXP3) AND action_type='STOP_FOR_GRACE'")
          test "$TASK_COUNT" -eq 2
          V13_QUEUE=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/service-expiry/queue)
          python3 -c 'import json,sys; a=json.load(sys.stdin)["data"]; ids=set(sys.argv[1:]); b=[r for r in a if str(r["serviceId"]) in ids]; assert len(b)==2; assert all(r.get("operationKey","").startswith("expiry:STOP_FOR_GRACE:") and r.get("actionType")=="STOP_FOR_GRACE" and r.get("taskStatus")=="PRECHECK_BLOCKED" for r in b)' "$EXP0" "$EXP3" <<< "$V13_QUEUE"
          echo 'V1.3 expiry queue contains durable task operation IDs and statuses'
          STATUS_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_instance WHERE id IN ($EXP0,$EXP3) AND status='ACTIVE' AND expiry_phase='STOP_PENDING'")
          test "$STATUS_COUNT" -eq 2
          CLAIM_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_egress_claim WHERE service_id IN ($EXP0,$EXP3) AND claim_status='RELEASED'")
          test "$CLAIM_COUNT" -eq 0
          echo 'R3 expiry planner idempotent, zero-day held, data-plane state unchanged (Mock-only)'
          # Fixed-IP original grace: prevent collecting payment for an impossible
          # RENEW order; within-grace still needs genuine adapter verification.
          FIXED_RENEW_0=$(printf '{"customerId":%s,"orderType":"RENEW","renewalServiceId":%s,"items":[{"productId":%s,"packageId":%s,"quantity":1,"serviceCount":1}]}' "$CID" "$EXP0" "$PID2" "$PKGID")
          OUTSIDE_CREATE_HTTP=$(curl -s -o /tmp/r3-outside-renew-create.json -w '%{http_code}' -H "$H" -H "$J" -d "$FIXED_RENEW_0" http://localhost:8080/api/admin/v1/orders)
          test "$OUTSIDE_CREATE_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/r3-outside-renew-create.json"))["code"]=="RENEW_OUTSIDE_GRACE"'
          FIXED_RENEW_3=$(printf '{"customerId":%s,"orderType":"RENEW","renewalServiceId":%s,"items":[{"productId":%s,"packageId":%s,"quantity":1,"serviceCount":1}]}' "$CID" "$EXP3" "$PID2" "$PKGID")
          FIXED_ORDER=$(curl -fsS -H "$H" -H "$J" -d "$FIXED_RENEW_3" http://localhost:8080/api/admin/v1/orders)
          FIXED_ORDER_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$FIXED_ORDER")
          curl -fsS -H "$H" -H "$J" -d '{"reason":"CI within-grace renewal approval"}' "http://localhost:8080/api/admin/v1/orders/$FIXED_ORDER_ID/confirm" >/dev/null
          curl -fsS -H "$H" -H "$J" -d '{"paymentReference":"CI-WITHIN-GRACE","reason":"Synthetic customer receipt verified"}' "http://localhost:8080/api/admin/v1/orders/$FIXED_ORDER_ID/payment-confirmation" >/dev/null
          FIXED_EXEC=$(printf '{"days":30,"renewalOrderId":%s,"reason":"CI verify original grace"}' "$FIXED_ORDER_ID")
          MOCK_FIXED_HTTP=$(curl -s -o /tmp/r3-within-grace-mock.json -w '%{http_code}' -H "$H" -H "$J" -d "$FIXED_EXEC" "http://localhost:8080/api/admin/v1/services/$EXP3/renew")
          test "$MOCK_FIXED_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/r3-within-grace-mock.json"))["code"]=="DATA_PLANE_ADAPTER_UNAVAILABLE"'
          # Simulate elapsed time between order payment and execution, without
          # calling any real network or changing the original grace-day contract.
