name: V1.2 CI

on:
  push:
    branches: [main, feature/v1.2-full-upgrade, feature/v1.2-round3-unified-baseline-20261014]
  pull_request:
    branches: [main, feature/v1.2-full-upgrade]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend
        run: mvn -B -DskipTests package
        working-directory: backend
      - name: Boot and exercise V1.2 core flow
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-v12-key-abcdefghijklmnopqrstuvwxyz-123456
          M1_ADMIN_PASSWORD: admin123
          SPRING_PROFILES_ACTIVE: m4-mock,m6-mock,m8-mock
          MONITOR_SCHEDULED_ENABLED: 'false'
          STATISTICS_SCHEDULED_ENABLED: 'false'
        run: |
          set -euo pipefail
          java -jar backend/target/ip-proxy-platform-backend.jar >/tmp/backend.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..60}; do curl -fsS http://localhost:8080/actuator/health >/dev/null && break || sleep 2; done
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["accessToken"])' <<< "$LOGIN")
          H="Authorization: Bearer $TOKEN"
          J='Content-Type: application/json'

          C=$(curl -fsS -H "$H" -H "$J" -d '{"customerName":"V12 CI Customer","customerTypeCode":"ENTERPRISE","contactName":"CI","contactPhone":"13800000000"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")
          for P in centos ros lines; do curl -fsS -H "$H" -H "$J" -d '{"reason":"V12 CI sync"}' http://localhost:8080/api/admin/v1/resources/$P/sync >/dev/null; done
          LINES=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/v12/resources/lines?page=1&size=20')
          L1=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]>=2; print(d["items"][0]["id"])' <<< "$LINES")
          L2=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["items"][1]["id"])' <<< "$LINES")
          POOL=$(curl -fsS -H "$H" -H "$J" -d "{\"poolCode\":\"CI-V12-SHARED\",\"poolName\":\"V12 Shared Pool\",\"poolType\":\"SHARED\",\"purpose\":\"CI\",\"regionCodes\":[],\"carrierCodes\":[],\"lineIds\":[$L1,$L2]}" http://localhost:8080/api/admin/v1/v12/resource-pools)
          POOLID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$POOL")
          MEMBERS=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/resource-pools/$POOLID/lines)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["total"]==2' <<< "$MEMBERS"

          PROD=$(curl -fsS -H "$H" -H "$J" -d '{"productCode":"CI-V12-SHORT","productName":"V12 Short IP","productType":"SHORT_IP","accessModeCode":"API_EXTRACT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"typeConfig":{"ipValidSeconds":60,"singleExtractLimit":10,"extractRateLimit":100,"extractRateWindowSeconds":60,"dedupPeriodSeconds":300,"whitelistRequired":true,"switchPolicy":{"mode":"BUILTIN"}}}' http://localhost:8080/api/admin/v1/products)
          PID2=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PROD")
          curl -fsS -H "$H" -H "$J" -d '{"reason":"V12 CI enable"}' http://localhost:8080/api/admin/v1/v12/products/$PID2/enable >/dev/null
          PKG=$(curl -fsS -H "$H" -H "$J" -d "{\"packageCode\":\"CI-V12-PKG\",\"productId\":$PID2,\"packageName\":\"V12 Package\",\"serviceDays\":30,\"extractQuota\":10000,\"price\":100,\"currency\":\"CNY\",\"quotaConfig\":{}}" http://localhost:8080/api/admin/v1/packages)
          PKGID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PKG")
          SVC=$(curl -fsS -H "$H" -H "$J" -d "{\"customerId\":$CID,\"productId\":$PID2,\"packageId\":$PKGID,\"deliveryMode\":\"SELF_OWNED\",\"remark\":\"CI\"}" http://localhost:8080/api/admin/v1/services/provision)
          SID=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="ACTIVE" and d["deliveryMode"]=="SELF_OWNED"; print(d["serviceId"])' <<< "$SVC")
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/services/$SID >/dev/null
          # R3 read-model and contract smoke; this remains Mock-only, not genuine proxy delivery.
          SUMMARY=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/services/$SID/delivery-summary)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["serviceId"]>0 and d["deliveryStage"] in ("MANAGEMENT_ONLY","MOCK_ONLY","ADAPTER_ACK_UNVERIFIED"); assert d["dataSource"]=="MANAGEMENT_DB_UNVERIFIED"' <<< "$SUMMARY"
          CLAIMS=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/services/$SID/egress-claims)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]==[]' <<< "$CLAIMS"
          GRACE=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/v12/packages/$PKGID/grace)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["packageId"]>0 and d["graceDays"] is None' <<< "$GRACE"
          # Lifecycle operations must not silently claim success against Mock-only adapters.
          STOP_CODE=$(curl -s -o /tmp/r3-mock-stop.json -w '%{http_code}' -H "$H" -H "$J" -d '{"reason":"R3 mock pause must be blocked"}' http://localhost:8080/api/admin/v1/services/$SID/suspend)
          test "$STOP_CODE" -ge 400
          AFTER_BLOCK=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/services/$SID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="ACTIVE"' <<< "$AFTER_BLOCK"
          echo 'R3 mocked lifecycle safe gate verified'
          echo 'R3 API read model / grace contract smoke passed (Mock only)'

          # R3 synthetic fixed-service fixtures exercise the safe planner ONLY.
          # They do not represent true LONG_IP network delivery or real entitlement migration.
          PGID=$(docker ps --filter "ancestor=postgres:17-alpine" --format '{{.ID}}' | head -n1)
          test -n "$PGID"
          docker exec "$PGID" psql -U ipproxy -d ip_proxy -v ON_ERROR_STOP=1 -c "
            INSERT INTO svc_instance(
              service_no,customer_id,product_id,package_id,product_type,
              product_snapshot,package_snapshot,quota_snapshot,
              effective_at,expire_at,status,grace_days_snapshot,grace_until_at,
              expiry_phase,delivery_stage
            )
            SELECT 'CI-R3-EXP-'||s.id||'-'||v.grace, s.customer_id,s.product_id,s.package_id,
                   'LONG_IP',s.product_snapshot,s.package_snapshot,s.quota_snapshot,
                   now()-interval '5 days',now()-interval '2 days','ACTIVE',v.grace,
                   now()-interval '2 days'+v.grace*interval '1 day','NONE','MOCK_ONLY'
            FROM svc_instance s CROSS JOIN (VALUES (0),(3)) v(grace) WHERE s.id=$SID
          "
          EXP0=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT id FROM svc_instance WHERE service_no='CI-R3-EXP-$SID-0'")
          EXP3=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT id FROM svc_instance WHERE service_no='CI-R3-EXP-$SID-3'")
          test -n "$EXP0" && test -n "$EXP3"
          SCAN=$(curl -fsS -H "$H" -H "$J" -d '{"limit":200,"reason":"CI deterministic expiry scan"}' http://localhost:8080/api/admin/v1/v12/service-expiry/reconcile)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["realActionsExecuted"]==0 and d["created"]+d["existing"]>=2' <<< "$SCAN"
          SECOND=$(curl -fsS -H "$H" -H "$J" -d '{"limit":200,"reason":"CI repeated expiry scan"}' http://localhost:8080/api/admin/v1/v12/service-expiry/reconcile)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["created"]==0 and d["existing"]>=2 and not d["dataPlaneVerified"]' <<< "$SECOND"
          TASK_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_action_task WHERE service_id IN ($EXP0,$EXP3) AND action_type='STOP_FOR_GRACE'")
          test "$TASK_COUNT" -eq 2
          STATUS_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_instance WHERE id IN ($EXP0,$EXP3) AND status='ACTIVE' AND expiry_phase='STOP_PENDING'")
          test "$STATUS_COUNT" -eq 2
          CLAIM_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM svc_egress_claim WHERE service_id IN ($EXP0,$EXP3) AND claim_status='RELEASED'")
          test "$CLAIM_COUNT" -eq 0
          echo 'R3 expiry planner idempotent, zero-day held, data-plane state unchanged (Mock-only)'
 
          # New-order provisioning: preview -> explicit item plan -> fulfill -> prevent duplicate
          ORDER=$(curl -fsS -H "$H" -H "$J" -d "{\"customerId\":$CID,\"orderType\":\"NEW\",\"currency\":\"CNY\",\"items\":[{\"productId\":$PID2,\"packageId\":$PKGID,\"quantity\":1,\"serviceCount\":2}]}" http://localhost:8080/api/admin/v1/orders)
          OID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$ORDER")
          curl -fsS -H "$H" -H "$J" -d '{"reason":"CI confirm"}' http://localhost:8080/api/admin/v1/orders/$OID/confirm >/dev/null
          PREVIEW=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/orders/$OID/provision-preview)
          ITEMID=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert len(d["items"])==1 and d["items"][0]["service_count"]==2; print(d["items"][0]["id"])' <<< "$PREVIEW")
          # Order confirmation alone must not bypass verified customer payment.
          PAYMENT=$(curl -fsS -H "$H" -H "$J" -d '{"paymentReference":"CI-PAID-RECEIPT-0001","reason":"CI privileged verification of external receipt"}' http://localhost:8080/api/admin/v1/orders/$OID/payment-confirmation)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["paymentStatus"]=="PAID_CONFIRMED"' <<< "$PAYMENT"
          PLAN=$(curl -fsS -H "$H" -H "$J" -d "{\"reason\":\"CI provision\",\"plans\":[{\"orderItemId\":$ITEMID,\"deliveryMode\":\"SELF_OWNED\",\"reverseProxyIds\":[]}]}" http://localhost:8080/api/admin/v1/orders/$OID/provision)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="PROVISIONED" and len(d["services"])==2 and all(x["status"]=="ACTIVE" for x in d["services"])' <<< "$PLAN"
          REPEAT_CODE=$(curl -s -o /tmp/repeat-provision.json -w '%{http_code}' -H "$H" -H "$J" -d "{\"reason\":\"repeat\",\"plans\":[{\"orderItemId\":$ITEMID,\"deliveryMode\":\"SELF_OWNED\",\"reverseProxyIds\":[]}]}" http://localhost:8080/api/admin/v1/orders/$OID/provision)
          test "$REPEAT_CODE" -ge 400
          echo 'Order provisioning preview/plan/idempotency smoke passed'
          # Order detail must distinguish actually created instances from renewal targets.
          ORDER_CHILDREN=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/orders/$OID/services")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]["items"]; assert len(x)==2 and all(v["relation_type"]=="CREATED_FROM_ORDER" for v in x)' <<< "$ORDER_CHILDREN"
          RENEW_JSON=$(printf '{"customerId":%s,"orderType":"RENEW","renewalServiceId":%s,"items":[{"productId":%s,"packageId":%s,"quantity":1,"serviceCount":1}]}' "$CID" "$SID" "$PID2" "$PKGID")
          RENEW_ORDER=$(curl -fsS -H "$H" -H "$J" -d "$RENEW_JSON" http://localhost:8080/api/admin/v1/orders)
          REN_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$RENEW_ORDER")
          REN_CHILDREN=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/orders/$REN_ID/services")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]["items"]; assert len(x)==1 and x[0]["relation_type"]=="RENEWAL_TARGET"' <<< "$REN_CHILDREN"
          echo 'Order-created service subtables and original service renewal target verified in Mock/DB'
          curl -fsS -H "$H" -H "$J" -d '{"reason":"CI renewal order approval"}' "http://localhost:8080/api/admin/v1/orders/$REN_ID/confirm" >/dev/null
          UNPAID_RENEW_BODY=$(printf '{"days":30,"renewalOrderId":%s,"reason":"CI renewal must not proceed unpaid"}' "$REN_ID")
          UNPAID_RENEW_HTTP=$(curl -s -o /tmp/r3-valid-unpaid-renew.json -w '%{http_code}' -H "$H" -H "$J" -d "$UNPAID_RENEW_BODY" "http://localhost:8080/api/admin/v1/services/$SID/renew")
          test "$UNPAID_RENEW_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/r3-valid-unpaid-renew.json"))["code"]=="RENEW_PAYMENT_OR_TARGET_INVALID"'
          curl -fsS -H "$H" -H "$J" -d '{"paymentReference":"CI-RENEW-ORDER-PAID","reason":"CI synthetic payment evidence"}' "http://localhost:8080/api/admin/v1/orders/$REN_ID/payment-confirmation" >/dev/null
          READY_RENEW=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/services/$SID/paid-renewal-orders")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]["items"]; assert len(x)==1 and x[0]["order_no"] and x[0]["payment_status"]=="PAID_CONFIRMED" and x[0]["status"]=="PENDING_PROVISION"' <<< "$READY_RENEW"
          echo 'Exactly targeted paid renewal order selection verified with synthetic payment evidence'
          OLD_TERM=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/services/$SID")
          OLD_EXP=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["expire_at"])' <<< "$OLD_TERM")
          BAD_TERM_BODY=$(printf '{"days":7,"renewalOrderId":%s,"reason":"CI term mismatch"}' "$REN_ID")
          BAD_TERM_HTTP=$(curl -s -o /tmp/r3-valid-term-mismatch.json -w '%{http_code}' -H "$H" -H "$J" -d "$BAD_TERM_BODY" "http://localhost:8080/api/admin/v1/services/$SID/renew")
          test "$BAD_TERM_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/r3-valid-term-mismatch.json"))["code"]=="RENEW_TERM_MISMATCH"'
          MOCK_RENEW_BODY=$(printf '{"days":30,"renewalOrderId":%s,"reason":"CI paid mock must not extend term"}' "$REN_ID")
          MOCK_RENEW_HTTP=$(curl -s -o /tmp/r3-valid-mock-renew.json -w '%{http_code}' -H "$H" -H "$J" -d "$MOCK_RENEW_BODY" "http://localhost:8080/api/admin/v1/services/$SID/renew")
          test "$MOCK_RENEW_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/r3-valid-mock-renew.json"))["code"]=="DATA_PLANE_ADAPTER_UNAVAILABLE"'
          NEW_TERM=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/services/$SID")
          NEW_EXP=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["expire_at"])' <<< "$NEW_TERM")
          test "$OLD_EXP" = "$NEW_EXP"
          RENEW_STATUS=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT status FROM biz_order WHERE id=$REN_ID")
          test "$RENEW_STATUS" = "PENDING_PROVISION"
          echo 'Unpaid, mismatched term and Mock renewal fail closed with exact business errors; DB term/order unchanged'



          # Synthetic supplier -> purchase -> proxy -> service drill-down only.
          # No upstream payment, access credential or network adapter is invoked.
          SUPID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "INSERT INTO res_supplier(supplier_code,supplier_name,api_endpoint,auth_type_code) VALUES('CI-SUPPLIER-R3','CI Supplier','https://supplier.invalid','TOKEN') RETURNING id" | head -n 1)
          PURID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "INSERT INTO res_supplier_purchase(purchase_no,supplier_id,customer_id,source_customer_order_id,supplier_package_name,expire_at) VALUES('CI-PUR-R3',$SUPID,$CID,$OID,'CI synthetic purchase',now()+interval '30 days') RETURNING id" | head -n 1)
          PROXYID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "INSERT INTO res_reverse_proxy(proxy_no,purchase_id,customer_id,service_id,protocol_code,upstream_host,upstream_port,platform_host,platform_port,status) VALUES('CI-PROXY-R3',$PURID,$CID,NULL,'HTTP','upstream.invalid',18080,'platform.invalid',18081,'PENDING') RETURNING id" | head -n 1)
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/supplier-purchases/$PURID/proxies" >/tmp/r3-purchase-proxies.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/supplier-purchases/$PURID/services" >/tmp/r3-purchase-services.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/external-delivery/purchases/$PURID" >/tmp/r3-purchase-detail.json
          python3 -c 'import json; x=json.load(open("/tmp/r3-purchase-proxies.json"))["data"]; assert x["items"][0]["proxy_no"]=="CI-PROXY-R3"'
          python3 -c 'import json; x=json.load(open("/tmp/r3-purchase-services.json"))["data"]; assert x["items"]==[]'
          python3 -c 'import json; x=json.load(open("/tmp/r3-purchase-detail.json"))["data"]; assert x["purchase_cost"] is None and x["source_customer_payment_status"]=="PAID_CONFIRMED"'
          echo 'Synthetic purchase/proxy config and no-fake-delivery subtable checks passed'

          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/long-monitor/overview >/dev/null
          curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/monitor/objects?page=1&size=20&objectType=CENTOS' >/dev/null
          curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/monitor/objects?page=1&size=20&objectType=ROS' >/dev/null
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/statistics/v12/pools/current >/tmp/v12-pool-stats.json
          for LOG_CATEGORY in centos ros dial ip-change remote domain external operation; do
            curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/runtime-logs/v12/$LOG_CATEGORY?page=1&size=10" >/tmp/v12-source-log.json
          done
          echo 'V1.2 pool membership statistics and eight additional scoped log endpoints queried'
          # Cross-document business substables: ensure real master-child SQL works in PostgreSQL.
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/customers/$CID/orders" >/tmp/r3-customer-orders.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/lines/$L1/pools" >/tmp/r3-line-pools.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/lines/$L1/services" >/tmp/r3-line-services.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/pools/$POOLID/services" >/tmp/r3-pool-services.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/services/$SID/bindings" >/tmp/r3-service-bindings.json
          python3 -c 'import json; d=json.load(open("/tmp/r3-customer-orders.json"))["data"]; assert any(x["id"]>0 for x in d["items"])'
          python3 -c 'import json; d=json.load(open("/tmp/r3-line-pools.json"))["data"]; assert any(x["pool_code"]=="CI-V12-SHARED" for x in d["items"])'
          python3 -c 'import json; d=json.load(open("/tmp/r3-service-bindings.json"))["data"]; assert len(d["items"])>0 and any(x["related_path"] for x in d["items"])'
          echo 'V1.2 customer/line/pool/service master-child relationship smoke passed'
          echo 'V1.2 core smoke passed'
      - name: Backend log on failure
        if: failure()
        run: tail -n 400 /tmp/backend.log || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: docker compose build backend frontend
