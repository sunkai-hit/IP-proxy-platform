          python3 -c 'import json; x=json.load(open("/tmp/r3-purchase-detail.json"))["data"]; assert x["purchase_cost"] is None and x["source_customer_payment_status"]=="PAID_CONFIRMED"'
          echo 'Synthetic purchase/proxy config and no-fake-delivery subtable checks passed'
          # Customer-paid procurement -> customer-owned proxy -> service: first-version
          # management-only positive and negative acceptance, no real supplier or gateway.
          EXTERNAL_LIST=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/external-delivery/purchases?page=1&size=20")
          PROXY_LIST=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/external-delivery/reverse-proxies?page=1&size=20")
          python3 -c 'import json,sys; assert isinstance(json.loads(sys.argv[1])["data"]["items"],list) and isinstance(json.loads(sys.argv[2])["data"]["items"],list)' "$EXTERNAL_LIST" "$PROXY_LIST"
          echo 'External purchase/proxy list without filters passed'
          CUSTOMER_TWO=$(curl -fsS -H "$H" -H "$J" -d '{"customerName":"CI Other Proxy Customer","customerTypeCode":"ENTERPRISE","contactName":"Other","contactPhone":"13800009999"}' http://localhost:8080/api/admin/v1/customers)
          CID_TWO=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$CUSTOMER_TWO")
          WRONG_PURCHASE=$(printf '{"supplierId":%s,"customerId":%s,"sourceCustomerOrderId":%s,"supplierPackageName":"CI wrong customer","expireAt":"2028-10-14T00:00:00Z"}' "$SUPID" "$CID_TWO" "$OID")
          WRONG_PURCHASE_HTTP=$(curl -s -o /tmp/r3-procure-wrong-owner.json -w '%{http_code}' -H "$H" -H "$J" -d "$WRONG_PURCHASE" http://localhost:8080/api/admin/v1/v12/external-delivery/purchases)
          if [ "$WRONG_PURCHASE_HTTP" -ne 400 ]; then echo "Unexpected wrong-owner purchase HTTP: $WRONG_PURCHASE_HTTP"; cat /tmp/r3-procure-wrong-owner.json; exit 1; fi
          python3 -c 'import json; assert json.load(open("/tmp/r3-procure-wrong-owner.json"))["code"]=="PURCHASE_PAYMENT_NOT_VERIFIED"'
          DEDICATED_PAYLOAD=$(printf '{"supplierId":%s,"customerId":%s,"sourceCustomerOrderId":%s,"supplierPackageName":"CI paid customer package","expireAt":"2028-10-14T00:00:00Z"}' "$SUPID" "$CID" "$OID")
          DEDICATED=$(curl -fsS -H "$H" -H "$J" -d "$DEDICATED_PAYLOAD" http://localhost:8080/api/admin/v1/v12/external-delivery/purchases)
          DEDICATED_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$DEDICATED")
          DEDICATED_DETAIL=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/v12/external-delivery/purchases/$DEDICATED_ID")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]; assert x["source_customer_payment_status"]=="PAID_CONFIRMED" and x["purchase_cost"] is None and x["package_quota"] is None' <<< "$DEDICATED_DETAIL"
          STOCK_ID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "INSERT INTO res_supplier_purchase(purchase_no,supplier_id,supplier_package_name,expire_at) VALUES('CI-UNASSIGNED-INVENTORY',$SUPID,'unassigned stock',now()+interval '50 days') RETURNING id" | sed -n '1p')
          STOCK_PROXY=$(printf '{"purchaseId":%s,"customerId":%s,"protocolCode":"HTTP","upstreamHost":"upstream.invalid","upstreamPort":8080,"platformHost":"platform.invalid","platformPort":18080}' "$STOCK_ID" "$CID")
          STOCK_HTTP=$(curl -s -o /tmp/r3-stock-proxy.json -w '%{http_code}' -H "$H" -H "$J" -d "$STOCK_PROXY" http://localhost:8080/api/admin/v1/v12/external-delivery/reverse-proxies)
          if [ "$STOCK_HTTP" -ne 400 ]; then echo "Unexpected STOCK_HTTP: $STOCK_HTTP"; cat /tmp/r3-stock-proxy.json; exit 1; fi
          python3 -c 'import json; assert json.load(open("/tmp/r3-stock-proxy.json"))["code"]=="PROXY_PURCHASE_CUSTOMER_MISMATCH"'
          BAD_PROXY=$(printf '{"purchaseId":%s,"customerId":%s,"protocolCode":"HTTP","upstreamHost":"upstream.invalid","upstreamPort":8080,"platformHost":"platform.invalid","platformPort":18080}' "$DEDICATED_ID" "$CID_TWO")
          BAD_PROXY_HTTP=$(curl -s -o /tmp/r3-cross-customer-proxy.json -w '%{http_code}' -H "$H" -H "$J" -d "$BAD_PROXY" http://localhost:8080/api/admin/v1/v12/external-delivery/reverse-proxies)
          if [ "$BAD_PROXY_HTTP" -ne 400 ]; then echo "Unexpected BAD_PROXY_HTTP: $BAD_PROXY_HTTP"; cat /tmp/r3-cross-customer-proxy.json; exit 1; fi
          python3 -c 'import json; assert json.load(open("/tmp/r3-cross-customer-proxy.json"))["code"]=="PROXY_PURCHASE_CUSTOMER_MISMATCH"'
          OTHER_SERVICE=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "
            INSERT INTO svc_instance(service_no,customer_id,product_id,package_id,product_type,product_snapshot,package_snapshot,quota_snapshot,effective_at,expire_at,status,delivery_stage)
            SELECT 'CI-OTHER-SERVICE',$CID_TWO,product_id,package_id,product_type,product_snapshot,package_snapshot,quota_snapshot,now(),now()+interval '28 days','ACTIVE','MOCK_ONLY' FROM svc_instance WHERE id=$SID RETURNING id" | sed -n '1p')
          WRONG_SERVICE_PROXY=$(printf '{"purchaseId":%s,"customerId":%s,"serviceId":%s,"protocolCode":"HTTP","upstreamHost":"upstream.invalid","upstreamPort":8080,"platformHost":"platform.invalid","platformPort":18080}' "$DEDICATED_ID" "$CID" "$OTHER_SERVICE")
          WRONG_SERVICE_HTTP=$(curl -s -o /tmp/r3-wrong-proxy-service.json -w '%{http_code}' -H "$H" -H "$J" -d "$WRONG_SERVICE_PROXY" http://localhost:8080/api/admin/v1/v12/external-delivery/reverse-proxies)
          if [ "$WRONG_SERVICE_HTTP" -ne 400 ]; then echo "Unexpected WRONG_SERVICE_HTTP: $WRONG_SERVICE_HTTP"; cat /tmp/r3-wrong-proxy-service.json; exit 1; fi
          python3 -c 'import json; assert json.load(open("/tmp/r3-wrong-proxy-service.json"))["code"]=="PROXY_SERVICE_CUSTOMER_MISMATCH"'
          GOOD_PROXY=$(printf '{"purchaseId":%s,"customerId":%s,"serviceId":%s,"protocolCode":"HTTP","upstreamHost":"upstream.invalid","upstreamPort":8080,"platformHost":"platform.invalid","platformPort":18080}' "$DEDICATED_ID" "$CID" "$SID")
          GOOD_PROXY_RESP=$(curl -fsS -H "$H" -H "$J" -d "$GOOD_PROXY" http://localhost:8080/api/admin/v1/v12/external-delivery/reverse-proxies)
          GOOD_PROXY_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$GOOD_PROXY_RESP")
          # A4 direct-service procurement reference is also a protected coverage source,
          # even when no reverse_proxy row points to the customer service.
          A4_DIRECT_PURCHASE=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "INSERT INTO res_supplier_purchase(purchase_no,supplier_id,customer_id,source_customer_order_id,supplier_package_name,expire_at) VALUES('CI-A4-DIRECT-PURCHASE',$SUPID,$CID,$OID,'CI direct supplier source',now()+interval '90 days') RETURNING id" | sed -n '1p')
          # The V17 service trigger requires BOTH a purchase and a same-customer
          # ACTIVE proxy. This is database-only synthetic fixture data: MOCK_ONLY
          # service and no gateway, supplier or upstream HTTP call is performed.
          A4_DIRECT_PROXY=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "
            INSERT INTO res_reverse_proxy(proxy_no,purchase_id,customer_id,protocol_code,upstream_host,upstream_port,platform_host,platform_port,status)
            VALUES('CI-A4-SYNTHETIC-PROXY',$A4_DIRECT_PURCHASE,$CID,'HTTP','ci-a4-no-network.invalid',8080,'ci-a4-gateway.invalid',18080,'ACTIVE') RETURNING id" | sed -n '1p')
          A4_DIRECT_SERVICE=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "
            INSERT INTO svc_instance(service_no,customer_id,product_id,package_id,product_type,product_snapshot,package_snapshot,quota_snapshot,effective_at,expire_at,status,delivery_stage,delivery_mode,supplier_purchase_id,reverse_proxy_id)
            SELECT 'CI-A4-DIRECT-SERVICE',customer_id,product_id,package_id,product_type,product_snapshot,package_snapshot,quota_snapshot,now(),now()+interval '29 days','ACTIVE','MOCK_ONLY','EXTERNAL_PROXY',$A4_DIRECT_PURCHASE,$A4_DIRECT_PROXY FROM svc_instance WHERE id=$SID RETURNING id" | sed -n '1p')
          test -n "$A4_DIRECT_SERVICE"
          A4_OLD_TERM=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT expire_at::text FROM res_supplier_purchase WHERE id=$A4_DIRECT_PURCHASE")
          A4_SHORT_TERM=$(python3 -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)+timedelta(days=1)).isoformat())')
          A4_SHORT_BODY=$(printf '{"supplierId":%s,"customerId":%s,"sourceCustomerOrderId":%s,"supplierPackageName":"CI direct supplier source","expireAt":"%s"}' "$SUPID" "$CID" "$OID" "$A4_SHORT_TERM")
          A4_SHORT_HTTP=$(curl -s -o /tmp/ci-a4-direct-term.json -w '%{http_code}' -X PUT -H "$H" -H "$J" -d "$A4_SHORT_BODY" "http://localhost:8080/api/admin/v1/v12/external-delivery/purchases/$A4_DIRECT_PURCHASE")
          test "$A4_SHORT_HTTP" -eq 400
          python3 -c 'import json; assert json.load(open("/tmp/ci-a4-direct-term.json"))["code"]=="PURCHASE_UPSTREAM_TERM_SHORT"'
          test "$A4_OLD_TERM" = "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT expire_at::text FROM res_supplier_purchase WHERE id=$A4_DIRECT_PURCHASE")"
          test "$A4_DIRECT_PURCHASE" = "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT supplier_purchase_id FROM svc_instance WHERE id=$A4_DIRECT_SERVICE")"
          echo 'A4 direct service→supplier paid purchase: shortened upstream term blocked, PostgreSQL contract and binding unchanged'
          REAL_APPLY_HTTP=$(curl -s -o /tmp/r3-proxy-noop-apply.json -w '%{http_code}' -H "$H" -H "$J" -d '{"reason":"CI cannot fake remote proxy"}' "http://localhost:8080/api/admin/v1/v12/external-delivery/reverse-proxies/$GOOD_PROXY_ID/apply")
          if [ "$REAL_APPLY_HTTP" -ne 400 ]; then echo "Unexpected REAL_APPLY_HTTP: $REAL_APPLY_HTTP"; cat /tmp/r3-proxy-noop-apply.json; exit 1; fi
          python3 -c 'import json; assert json.load(open("/tmp/r3-proxy-noop-apply.json"))["code"]=="EXTERNAL_PROXY_DATA_PLANE_UNVERIFIED"'
          test "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT status FROM res_reverse_proxy WHERE id=$GOOD_PROXY_ID")" = "PENDING"
          PURCHASE_PROXIES=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/supplier-purchases/$DEDICATED_ID/proxies")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]["items"]; assert len(x)==1 and x[0]["id"]==int(sys.argv[1])' "$GOOD_PROXY_ID" <<< "$PURCHASE_PROXIES"
          echo 'Customer-paid procurement/proxy ownership and Mock fail-closed delivery verified'


          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/long-monitor/overview >/dev/null
          curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/monitor/objects?page=1&size=20&objectType=CENTOS' >/dev/null
          curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/monitor/objects?page=1&size=20&objectType=ROS' >/dev/null
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/statistics/v12/pools/current >/tmp/v12-pool-stats.json
          for LOG_CATEGORY in centos ros dial ip-change remote domain external operation; do
            curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/runtime-logs/v12/$LOG_CATEGORY?page=1&size=10" >/tmp/v12-source-log.json
          done
          echo 'V1.2 pool membership statistics and eight additional scoped log endpoints queried'
          # Cross-document business substables: ensure real master-child SQL works in PostgreSQL.
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/customers/$CID/orders" >/tmp/r3-customer-orders.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/lines/$L1/pools" >/tmp/r3-line-pools.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/lines/$L1/services" >/tmp/r3-line-services.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/pools/$POOLID/services" >/tmp/r3-pool-services.json
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/relations/services/$SID/bindings" >/tmp/r3-service-bindings.json
          python3 -c 'import json; d=json.load(open("/tmp/r3-customer-orders.json"))["data"]; assert any(x["id"]>0 for x in d["items"])'
          python3 -c 'import json; d=json.load(open("/tmp/r3-line-pools.json"))["data"]; assert any(x["pool_code"]=="CI-V12-SHARED" for x in d["items"])'
          python3 -c 'import json; d=json.load(open("/tmp/r3-service-bindings.json"))["data"]; assert len(d["items"])>0 and any(x["related_path"] for x in d["items"])'
          echo 'V1.2 customer/line/pool/service master-child relationship smoke passed'
          # UI-31 existing bot management: Webhook and adapter secrets must not
          # leak from list/detail responses, even if stored in historical records.
          BOT_ID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "INSERT INTO lm_bot(bot_no,customer_id,bot_name,bot_type,webhook_url,last_test_message) VALUES('CI-BOT-MASK-R3',$CID,'CI bot','DINGTALK','https://example.invalid/secret-webhook-key','raw secret adapter diagnostic') RETURNING id" | sed -n '1p')
          BOT_LIST=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/long-monitor/bots?page=1&size=20")
          python3 -c 'import json,sys; rows=json.load(sys.stdin)["data"]["items"]; x=next(v for v in rows if v["bot_no"]=="CI-BOT-MASK-R3"); assert "webhook_url" not in x and "last_test_message" not in x and x["webhook_configured"] is True' <<< "$BOT_LIST"
          BOT_DETAIL=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/long-monitor/bots/$BOT_ID")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]; assert "webhook_url" not in x and "access_token_cipher" not in x and "secret_cipher" not in x and "last_test_message" not in x and x["webhook_mask"]=="已配置（不回显地址）" and isinstance(x["monitorReferences"],list)' <<< "$BOT_DETAIL"
          echo 'UI-31 bot secret redaction and monitor reference shape verified'
          # A5: a REAL PostgreSQL OPEN incident exists independently of probe
          # transport. This synthetic LONG_IP/Mock fixture never contacts devices.
          A5_MON_ID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "
            INSERT INTO lm_monitor(monitor_no,customer_id,service_id,target_host,target_port,bot_id,current_status,consecutive_failures,consecutive_successes,failure_threshold,recovery_threshold,last_failure_at)
            VALUES('CI-A5-OPEN-UNKNOWN',$CID,$EXP3,'ci-monitor.invalid',18080,$BOT_ID,'ABNORMAL',3,1,3,2,now()-interval '1 hour') RETURNING id" | sed -n '1p')
          A5_ALARM_ID=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "
            INSERT INTO lm_alarm(alarm_no,monitor_id,customer_id,service_id,status)
            VALUES('CI-A5-ALARM-OPEN',$A5_MON_ID,$CID,$EXP3,'OPEN') RETURNING id" | sed -n '1p')
          A5_LAST_FAILURE=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT last_failure_at::text FROM lm_monitor WHERE id=$A5_MON_ID")
          A5_CHECK=$(curl -fsS -H "$H" -H "$J" -d '{"reason":"CI A5 unknown real-adapter guard"}' "http://localhost:8080/api/admin/v1/long-monitor/monitors/$A5_MON_ID/check")
          python3 -c 'import json,sys; x=json.load(sys.stdin)["data"]; assert x["adapterStatus"]=="UNKNOWN" and x["after"]=="UNKNOWN" and x["consecutiveFailures"]==0 and x["consecutiveSuccesses"]==0,x' <<< "$A5_CHECK"
          test "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT status FROM lm_alarm WHERE id=$A5_ALARM_ID")" = "OPEN"
          test "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT current_status FROM lm_monitor WHERE id=$A5_MON_ID")" = "UNKNOWN"
          test "$A5_LAST_FAILURE" = "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT last_failure_at::text FROM lm_monitor WHERE id=$A5_MON_ID")"
          test "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM lm_check_record WHERE monitor_id=$A5_MON_ID")" = "1"
          test "$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM lm_notification WHERE monitor_id=$A5_MON_ID")" = "0"
          echo 'A5 PostgreSQL OPEN alarm held through Noop UNKNOWN, no false delivery or failure timestamp'

          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/long-monitor/monitors?page=1&size=20" >/dev/null
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/long-monitor/alarms?page=1&size=20" >/dev/null
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/long-monitor/notifications?page=1&size=20" >/dev/null
          echo 'Monitor, alarm and notification default-list HTTP checks passed'
          echo 'V1.3 backend business smoke passed'
          # CI-only least-privilege actor. Copy the test admin's bcrypt digest
          # ONLY inside the ephemeral PostgreSQL runner; never expose it.
          docker exec -i "$PGID" psql -v ON_ERROR_STOP=1 -U ipproxy -d ip_proxy <<'SQL'
          INSERT INTO sys_role(role_code,role_name,data_scope)
          VALUES ('CI_V13_READONLY','CI V1.3 read-only acceptance actor','ALL')
          ON CONFLICT DO NOTHING;
          INSERT INTO sys_user(username,password_hash,display_name,status)
          SELECT 'ci_v13_readonly', password_hash, 'CI Read Only', 'ACTIVE'
          FROM sys_user WHERE username='admin' AND deleted=FALSE
          ON CONFLICT DO NOTHING;
          INSERT INTO sys_user_role(user_id,role_id)
          SELECT u.id,r.id FROM sys_user u CROSS JOIN sys_role r
          WHERE u.username='ci_v13_readonly' AND r.role_code='CI_V13_READONLY'
          ON CONFLICT DO NOTHING;
          INSERT INTO sys_role_permission(role_id,permission_id)
          SELECT r.id,p.id FROM sys_role r CROSS JOIN sys_permission p
          WHERE r.role_code='CI_V13_READONLY'
            AND p.permission_code IN (
              'customer:access','customer:read','order-service:access',
              'order:read','service:read')
          ON CONFLICT DO NOTHING;
          SQL
          RBAC_COUNT=$(docker exec "$PGID" psql -U ipproxy -d ip_proxy -At -c "SELECT count(*) FROM sys_role_permission rp JOIN sys_role r ON rp.role_id=r.id WHERE r.role_code='CI_V13_READONLY'")
          test "$RBAC_COUNT" = "5"
          echo 'CI least-privilege actor seeded with exactly five read/menu permissions'
          # The same Spring Boot, PostgreSQL and Redis instances remain live
          # for actual Chromium user-interface E2E. No product-group network
          # writes are enabled; source records use synthetic CI adapter data.
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/vite-e2e.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" "$PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          # Verify the browser-facing Vite origin can reach the actual
          # Spring authentication endpoint, not just return index.html.
          VITE_LOGIN_STATUS=$(curl -s -o /tmp/vite-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:5173' \
            -d '{"username":"admin","password":"admin123"}' \
            http://127.0.0.1:5173/api/admin/v1/auth/login)
          if [ "$VITE_LOGIN_STATUS" != "200" ]; then
            echo "Browser-facing API login preflight failed HTTP $VITE_LOGIN_STATUS"
            cat /tmp/vite-login.json || true
            tail -n 100 /tmp/vite-e2e.log || true
            exit 1
          fi
          echo 'Vite proxy -> real Spring login HTTP preflight OK'
          (
            cd frontend
            V13_E2E_USER=admin V13_E2E_PASSWORD=admin123 \
            V13_E2E_CUSTOMER_ID="$CID" V13_E2E_ORDER_ID="$MULTI_ID" \
            V13_E2E_SERVICE_ID="$SID" V13_E2E_POOL_ID="$POOLID" \
            V13_E2E_UNPAID_ORDER_ID="$LONG_OID" \
            V13_E2E_A5_MONITOR_ID="$A5_MON_ID" \
            V13_E2E_VIEWER_USER=ci_v13_readonly V13_E2E_VIEWER_PASSWORD=admin123 \
            PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/a-exit-playwright.json" npx playwright test tests/e2e/v13-real-backend.spec.ts tests/e2e/v13-least-privilege.spec.ts --reporter=line,json --workers=1 --timeout=40000
          )
          echo 'V1.3 Chromium actual browser + Spring Boot/PostgreSQL E2E smoke passed'
      - name: Export sanitized A-EXIT evidence index even if a previous test failed
        if: always()
        run: python3 scripts/ci_v13_a_exit_evidence_export.py --out a-exit-ci-evidence
      - name: Verify sanitized A-EXIT evidence matches checkout and real test reports
        if: success()
        run: python3 scripts/ci_v13_a_exit_evidence_export.py --verify --out a-exit-ci-evidence --min-java 112 --min-browser 150
      - name: Upload sanitized A-EXIT automated evidence index (not human signoff)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-exit-index-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            a-exit-ci-evidence/README.md
            a-exit-ci-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Backend log on failure
        if: failure()
        run: tail -n 400 /tmp/backend.log || true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application images
        run: docker compose build backend frontend
