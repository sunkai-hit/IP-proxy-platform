name: One-time A3 merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-cleanup-pr28-once.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove only exact merged PR28 branch with lease
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/v13-a3-pool-evidence-reliability-20261016'
          expected='503b2bc76d39a55108d570c9db1050e9175bbdf7'
          current="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [[ -z "${current}" ]]; then
            echo "Already absent: ${branch}"
            exit 0
          fi
          if [[ "${current}" != "${expected}" ]]; then
            echo "::error::Branch moved; preserving it."
            exit 1
          fi
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${current}" "${GITHUB_SHA}"; then
            echo "::error::Not merged into main, retaining branch"
            exit 1
          fi
          git push --force-with-lease="refs/heads/${branch}:${current}" origin ":refs/heads/${branch}"
          echo "DELETED merged PR28 branch: ${branch}"
