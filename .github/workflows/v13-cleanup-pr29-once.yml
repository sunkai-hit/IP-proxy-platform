name: One-time cleanup merged PR29 branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-cleanup-pr29-once.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete only merged exact PR29 branch
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/v13-a-sensitive-service-action-guard-20261016'
          expected='fe0b77f7a394bb7ec9ec47c0c4bb29f022144f4e'
          current="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [[ -z "${current}" ]]; then echo 'Already absent'; exit 0; fi
          if [[ "${current}" != "${expected}" ]]; then echo "::error::Branch changed"; exit 1; fi
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${current}" "${GITHUB_SHA}"; then
            echo "::error::Branch not fully merged"; exit 1
          fi
          git push --force-with-lease="refs/heads/${branch}:${current}" origin ":refs/heads/${branch}"
          echo "DELETED merged PR29 branch ${branch}"
