name: One-time cleanup merged A1 PR30 branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-cleanup-pr30-once.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete only exact fully merged PR30 branch
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/v13-a1-order-approval-snapshot-20261016'
          expected='91e6cf44e40a1ea250f98fa04dbd3cf168f5eb0b'
          current="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [[ -z "${current}" ]]; then echo 'Already absent'; exit 0; fi
          if [[ "${current}" != "${expected}" ]]; then echo "::error::Branch has moved, preserving it"; exit 1; fi
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${current}" "${GITHUB_SHA}"; then echo "::error::Branch not merged into main"; exit 1; fi
          git push --force-with-lease="refs/heads/${branch}:${current}" origin ":refs/heads/${branch}"
          echo "DELETED merged A1 PR30 branch: ${branch}"
