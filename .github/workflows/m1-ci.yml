name: M3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Start backend and validate M3 customer lifecycle
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-m3-secret-key-with-more-than-32-bytes-123456
          M1_ADMIN_PASSWORD: admin123
        run: |
          java -jar backend/target/ip-proxy-platform-backend.jar > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); assert "customer:access" in d["data"]["user"]["permissions"]; print(d["data"]["accessToken"])' <<< "$LOGIN")
          H="Authorization: Bearer $TOKEN"
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/options
          C=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"customerName":"CI测试企业","customerTypeCode":"ENTERPRISE","contactName":"CI联系人","contactPhone":"13800000000","contactEmail":"ci@example.com","remark":"M3 smoke"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")
          curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/customers?keyword=CI测试企业"
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/$CID
          A=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"authTypeCode":"ENTERPRISE","submittedData":{"subjectName":"CI测试企业","documentNo":"CI-DEMO"},"attachmentRefs":[]}' http://localhost:8080/api/admin/v1/customers/$CID/auth)
          AID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$A")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"opinion":"CI审核通过"}' http://localhost:8080/api/admin/v1/customer-auth/$AID/approve
          AC=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"customerId\":$CID,\"username\":\"ci_customer\",\"password\":\"ciPass123\",\"accountTypeCode\":\"DEFAULT\"}" http://localhost:8080/api/admin/v1/customer-accounts)
          ACID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$AC")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"password":"ciPass456","reason":"M3 smoke reset"}' http://localhost:8080/api/admin/v1/customer-accounts/$ACID/reset-password
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M3 smoke freeze"}' http://localhost:8080/api/admin/v1/customer-accounts/$ACID/freeze
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M3 smoke resume"}' http://localhost:8080/api/admin/v1/customer-accounts/$ACID/resume
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M3 smoke freeze customer"}' http://localhost:8080/api/admin/v1/customers/$CID/freeze
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M3 smoke resume customer"}' http://localhost:8080/api/admin/v1/customers/$CID/resume
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/$CID/usage
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/$CID/credentials
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/system/operation-logs
      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock-only && npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
