name: M4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Start backend and validate M3 regression plus M4 resource lifecycle
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-m4-secret-key-with-more-than-32-bytes-123456
          M1_ADMIN_PASSWORD: admin123
          SPRING_PROFILES_ACTIVE: m4-mock
        run: |
          set -euo pipefail
          java -jar backend/target/ip-proxy-platform-backend.jar > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); p=d["data"]["user"]["permissions"]; assert "customer:access" in p and "resource:access" in p and "resource:sync" in p; print(d["data"]["accessToken"])' <<< "$LOGIN")
          H="Authorization: Bearer $TOKEN"

          echo '--- M3 regression ---'
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/options >/dev/null
          C=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"customerName":"M4回归客户","customerTypeCode":"ENTERPRISE","contactName":"CI","contactPhone":"13800000000","contactEmail":"m4@example.com","remark":"M4 regression"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/$CID >/dev/null

          echo '--- M4 base-resource sync: CentOS -> ROS -> Line -> IP ---'
          for P in centos ros lines ips; do
            R=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M4 CI层级同步"}' http://localhost:8080/api/admin/v1/resources/$P/sync)
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["data"]["taskId"]>0' <<< "$R"
          done
          CENTOS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/resources/centos?page=1&size=20')
          ROS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/resources/ros?page=1&size=20')
          LINES=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/resources/lines?page=1&size=20')
          IPS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/resources/ips?page=1&size=20')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2 and all(x["online_status"]=="ONLINE" for x in d["items"])' <<< "$CENTOS"
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2 and all(x["centos_id"] for x in d["items"])' <<< "$ROS"
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2 and all(x["ros_id"] for x in d["items"])' <<< "$LINES"
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2 and all(x["source_type"]=="SELF" for x in d["items"])' <<< "$IPS"
          LINEID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["items"][0]["id"])' <<< "$LINES")

          echo '--- M4 resource pool ---'
          POOL=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"poolCode":"CI-MIXED","poolName":"CI统一资源池","purpose":"M4 smoke","regionCodes":[],"carrierCodes":[],"sourceScope":"MIXED","admissionRule":{},"detectionRule":{},"dedupRule":{},"priority":10}' http://localhost:8080/api/admin/v1/resource-pools)
          POOLID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$POOL")
          RECALC=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M4 CI首次入池"}' http://localhost:8080/api/admin/v1/resource-pools/$POOLID/recalculate)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["memberCount"]==2' <<< "$RECALC"

          echo '--- M4 domain reference ---'
          DOMAIN=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"domainName\":\"ci-m4.example.test\",\"currentIpId\":null,\"lineId\":$LINEID,\"usageTypeCode\":\"TUNNEL_ENTRY\",\"updateMode\":\"AUTO\"}" http://localhost:8080/api/admin/v1/domains)
          DOMAINID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$DOMAIN")
          DREF=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M4 CI刷新域名目标"}' http://localhost:8080/api/admin/v1/domains/$DOMAINID/refresh)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="PENDING_UPDATE" and "DNS" in d["message"]' <<< "$DREF"

          echo '--- M4 external supplier and unified pool ---'
          SUP=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"supplierCode":"CI-SUP","supplierName":"CI外部供应商","contactName":"CI","contactPhone":"10000","apiEndpoint":"https://mock-supplier.example/api","authTypeCode":"TOKEN","apiAccount":"ci-account","secret":"ci-supplier-secret","regionCodes":[],"carrierCodes":[],"fetchMode":"MANUAL"}' http://localhost:8080/api/admin/v1/suppliers)
          SUPID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$SUP")
          STEST=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M4 CI供应商连通测试"}' http://localhost:8080/api/admin/v1/suppliers/$SUPID/test)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["interfaceStatus"]=="NORMAL" and d["reachable"] is True' <<< "$STEST"
          SDETAIL=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/suppliers/$SUPID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["secret_configured"] is True and "secret_cipher" not in d and "secret" not in d' <<< "$SDETAIL"
          EXT=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"sourceType\":\"SUPPLIER\",\"supplierId\":$SUPID,\"targetPoolId\":$POOLID,\"reason\":\"M4 CI外部资源入池\"}" http://localhost:8080/api/admin/v1/sync-tasks)
          EXTID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["taskId"])' <<< "$EXT")
          EXTDETAIL=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/sync-tasks/$EXTID/details)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert len(d)==2 and all(x["process_status"]=="IMPORTED" for x in d)' <<< "$EXTDETAIL"
          MEMBERS=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/resource-pools/$POOLID/ips?page=1&size=20")
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==4 and {x["source_type"] for x in d["items"]}=={"SELF","EXTERNAL"}' <<< "$MEMBERS"

          echo '--- M4 overview/audit ---'
          OVERVIEW=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/resources/overview)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["centos_total"]==2 and d["ros_total"]==2 and d["line_total"]==2 and d["ip_total"]==4 and d["external_ip_total"]==2 and d["active_pool_total"]==1 and d["active_supplier_total"]==1' <<< "$OVERVIEW"
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/system/operation-logs >/dev/null
      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock-only && npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
