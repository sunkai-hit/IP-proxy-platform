name: M5 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Start backend and validate M3/M4 regression plus M5 product lifecycle
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-m5-secret-key-with-more-than-32-bytes-123456
          M1_ADMIN_PASSWORD: admin123
          SPRING_PROFILES_ACTIVE: m4-mock
        run: |
          set -euo pipefail
          java -jar backend/target/ip-proxy-platform-backend.jar > /tmp/backend.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/actuator/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); p=d["data"]["user"]["permissions"]; assert "customer:access" in p and "resource:access" in p and "resource:sync" in p and "product:access" in p and "product:strategy:validate" in p; print(d["data"]["accessToken"])' <<< "$LOGIN")
          H="Authorization: Bearer $TOKEN"

          echo '--- M3 regression ---'
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/options >/dev/null
          C=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"customerName":"M5回归客户","customerTypeCode":"ENTERPRISE","contactName":"CI","contactPhone":"13800000000","contactEmail":"m5@example.com","remark":"M5 regression"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/customers/$CID >/dev/null

          echo '--- M4 base-resource sync: CentOS -> ROS -> Line -> IP ---'
          for P in centos ros lines ips; do
            R=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI资源回归"}' http://localhost:8080/api/admin/v1/resources/$P/sync)
            python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["taskId"]>0' <<< "$R"
          done
          LINES=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/resources/lines?page=1&size=20')
          LINEID=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2; print(d["items"][0]["id"])' <<< "$LINES")
          IPS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/resources/ips?page=1&size=20')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2 and all(x["source_type"]=="SELF" for x in d["items"])' <<< "$IPS"

          POOL=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"poolCode":"CI-MIXED","poolName":"CI统一资源池","purpose":"M5 smoke","regionCodes":[],"carrierCodes":[],"sourceScope":"MIXED","admissionRule":{},"detectionRule":{},"dedupRule":{},"priority":10}' http://localhost:8080/api/admin/v1/resource-pools)
          POOLID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$POOL")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI自有资源入池"}' http://localhost:8080/api/admin/v1/resource-pools/$POOLID/recalculate >/dev/null

          DOMAIN=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"domainName\":\"ci-m5.example.test\",\"currentIpId\":null,\"lineId\":$LINEID,\"usageTypeCode\":\"TUNNEL_ENTRY\",\"updateMode\":\"AUTO\"}" http://localhost:8080/api/admin/v1/domains)
          DOMAINID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$DOMAIN")

          SUP=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"supplierCode":"CI-SUP","supplierName":"CI外部供应商","contactName":"CI","contactPhone":"10000","apiEndpoint":"https://mock-supplier.example/api","authTypeCode":"TOKEN","apiAccount":"ci-account","secret":"ci-supplier-secret","regionCodes":[],"carrierCodes":[],"fetchMode":"MANUAL"}' http://localhost:8080/api/admin/v1/suppliers)
          SUPID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$SUP")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI供应商测试"}' http://localhost:8080/api/admin/v1/suppliers/$SUPID/test >/dev/null
          EXT=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"sourceType\":\"SUPPLIER\",\"supplierId\":$SUPID,\"targetPoolId\":$POOLID,\"reason\":\"M5 CI外部资源入池\"}" http://localhost:8080/api/admin/v1/sync-tasks)
          EXTID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["taskId"])' <<< "$EXT")
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/sync-tasks/$EXTID/details >/dev/null
          MEMBERS=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/resource-pools/$POOLID/ips?page=1&size=20")
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==4 and {x["source_type"] for x in d["items"]}=={"SELF","EXTERNAL"}' <<< "$MEMBERS"

          echo '--- M5 five product types ---'
          SHORT=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-SHORT","productName":"CI短效IP","productType":"SHORT_IP","accessModeCode":"API_EXTRACT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN","WHITELIST"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"description":"M5 short","typeConfig":{"ipValidSeconds":60,"singleExtractLimit":10,"extractRateLimit":100,"extractRateWindowSeconds":60,"dedupPeriodSeconds":300,"whitelistRequired":true,"switchPolicy":{"mode":"ROTATE"}}}' http://localhost:8080/api/admin/v1/products)
          SHORTID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$SHORT")
          LONG=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-LONG","productName":"CI长效IP","productType":"LONG_IP","accessModeCode":"DIRECT","protocolCodes":["HTTP"],"authModeCodes":["USERNAME_PASSWORD"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"description":"M5 long","typeConfig":{"holdPeriodSeconds":86400,"bindType":"LINE","autoReplace":true,"failureThreshold":3,"failoverPolicy":{"mode":"AUTO"}}}' http://localhost:8080/api/admin/v1/products)
          LONGID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$LONG")
          EXC=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-EXCLUSIVE","productName":"CI独享IP","productType":"EXCLUSIVE_IP","accessModeCode":"DIRECT","protocolCodes":["HTTP"],"authModeCodes":["USERNAME_PASSWORD"],"resourceMode":"EXCLUSIVE","regionCodes":[],"carrierCodes":[],"description":"M5 exclusive","typeConfig":{"exclusiveResourceType":"IP","resourceCountDefault":1,"lockTimeoutSeconds":300,"replacementRule":{},"releaseRule":{}}}' http://localhost:8080/api/admin/v1/products)
          EXCID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$EXC")
          VPN=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-VPN","productName":"CI VPN","productType":"VPN","accessModeCode":"VPN","protocolCodes":[],"authModeCodes":["PRIVATE_KEY"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"description":"M5 vpn","typeConfig":{"vpnProtocolCode":"TBD","credentialTypeCode":"VPN_PRIVATE_KEY","defaultDeviceLimit":2,"defaultConnectionLimit":2,"outboundPolicy":{}}}' http://localhost:8080/api/admin/v1/products)
          VPNID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$VPN")
          TUN=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"productCode\":\"CI-TUNNEL\",\"productName\":\"CI隧道\",\"productType\":\"TUNNEL\",\"accessModeCode\":\"TUNNEL\",\"protocolCodes\":[\"HTTP\"],\"authModeCodes\":[\"USERNAME_PASSWORD\"],\"resourceMode\":\"SHARED\",\"regionCodes\":[],\"carrierCodes\":[],\"description\":\"M5 tunnel\",\"typeConfig\":{\"entryDomainId\":$DOMAINID,\"entryHost\":null,\"entryPort\":18080,\"sessionHoldSeconds\":300,\"concurrencyLimit\":100,\"ipSwitchPolicy\":{}}}" http://localhost:8080/api/admin/v1/products)
          TUNID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$TUN")

          echo '--- M5 product cannot enable without active valid strategy ---'
          PRE=$(curl -s -o /tmp/m5-pre.json -w '%{http_code}' -H "$H" -H 'Content-Type: application/json' -d '{"reason":"验证启用前置条件"}' http://localhost:8080/api/admin/v1/products/$SHORTID/enable)
          test "$PRE" -ge 400

          echo '--- M5 strategy create -> validate -> enable -> product enable ---'
          make_strategy(){
            PID=$1; CODE=$2
            S=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"strategyCode\":\"$CODE-ST\",\"strategyName\":\"$CODE统一池策略\",\"productId\":$PID,\"dispatchMode\":\"QUALITY_FIRST\",\"sourcePriority\":[\"SELF\",\"EXTERNAL\"],\"regionCodes\":[],\"carrierCodes\":[],\"poolBindings\":[{\"poolId\":$POOLID,\"priority\":10,\"weight\":100,\"enabled\":true}],\"scopes\":[],\"failoverRule\":{},\"ipHoldRule\":{},\"switchRule\":{}}" http://localhost:8080/api/admin/v1/resource-strategies)
            SID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$S")
            V=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI策略验证"}' http://localhost:8080/api/admin/v1/resource-strategies/$SID/validate)
            python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["valid"] is True and d["usablePoolCount"]==1 and d["memberCount"]==4' <<< "$V"
            curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI启用策略"}' http://localhost:8080/api/admin/v1/resource-strategies/$SID/enable >/dev/null
            curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI启用产品"}' http://localhost:8080/api/admin/v1/products/$PID/enable >/dev/null
          }
          make_strategy "$SHORTID" CI-SHORT
          make_strategy "$LONGID" CI-LONG
          make_strategy "$EXCID" CI-EXCLUSIVE
          make_strategy "$VPNID" CI-VPN
          make_strategy "$TUNID" CI-TUNNEL

          echo '--- M5 package lifecycle ---'
          PK=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"packageCode\":\"CI-SHORT-30D\",\"productId\":$SHORTID,\"packageName\":\"短效30天\",\"serviceDays\":30,\"ipCount\":null,\"extractQuota\":10000,\"trafficQuotaBytes\":null,\"concurrencyLimit\":20,\"deviceLimit\":null,\"whitelistLimit\":20,\"changeIpLimit\":null,\"price\":99.00,\"currency\":\"CNY\",\"quotaConfig\":{}}" http://localhost:8080/api/admin/v1/packages)
          PKID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PK")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI停用套餐"}' http://localhost:8080/api/admin/v1/packages/$PKID/disable >/dev/null
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI恢复套餐"}' http://localhost:8080/api/admin/v1/packages/$PKID/enable >/dev/null
          PKCOPY=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI复制套餐"}' http://localhost:8080/api/admin/v1/packages/$PKID/copy)
          PKCOPYID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PKCOPY")
          PKCOPYDETAIL=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/packages/$PKCOPYID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="DISABLED"' <<< "$PKCOPYDETAIL"

          echo '--- M5 product copy boundary ---'
          PCOPY=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M5 CI复制产品"}' http://localhost:8080/api/admin/v1/products/$SHORTID/copy)
          PCOPYID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PCOPY")
          PCOPYDETAIL=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/products/$PCOPYID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="DRAFT" and d["package_total"]==0 and d["strategy_total"]==0 and d["type_config"]["ip_valid_seconds"]==60' <<< "$PCOPYDETAIL"

          echo '--- M5 five configs and overview ---'
          for PID in "$SHORTID" "$LONGID" "$EXCID" "$VPNID" "$TUNID"; do curl -fsS -H "$H" http://localhost:8080/api/admin/v1/products/$PID >/dev/null; done
          POV=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/products/overview)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["product_total"]==6 and d["active_product_total"]==5 and d["active_product_type_total"]==5 and d["active_strategy_total"]==5 and d["active_package_total"]==1' <<< "$POV"
          PL=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/products?page=1&size=20&productType=SHORT_IP')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2' <<< "$PL"
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/system/operation-logs >/dev/null
      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock-only && npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
