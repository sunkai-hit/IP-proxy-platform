name: M6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Validate M3-M6 lifecycle
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-m6-secret-key-with-more-than-32-bytes-123456
          M1_ADMIN_PASSWORD: admin123
          SPRING_PROFILES_ACTIVE: m4-mock,m6-mock
        run: |
          set -euo pipefail
          java -jar backend/target/ip-proxy-platform-backend.jar > /tmp/backend.log 2>&1 &
          for i in {1..60}; do curl -fsS http://localhost:8080/actuator/health >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:8080/actuator/health >/dev/null
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); p=d["data"]["user"]["permissions"]; assert all(x in p for x in ["customer:access","resource:access","product:access","order-service:access","order:provision","service:release"]); print(d["data"]["accessToken"])' <<< "$LOGIN")
          H="Authorization: Bearer $TOKEN"

          echo '--- M3 customer ---'
          C=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"customerName":"M6生命周期客户","customerTypeCode":"ENTERPRISE","contactName":"CI","contactPhone":"13800000000","contactEmail":"m6@example.com","remark":"M6 smoke"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")

          echo '--- M4 resources and pool ---'
          for P in centos ros lines ips; do curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6资源准备"}' http://localhost:8080/api/admin/v1/resources/$P/sync >/dev/null; done
          POOL=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"poolCode":"CI-M6-POOL","poolName":"M6统一资源池","purpose":"M6 lifecycle","regionCodes":[],"carrierCodes":[],"sourceScope":"MIXED","admissionRule":{},"detectionRule":{},"dedupRule":{},"priority":10}' http://localhost:8080/api/admin/v1/resource-pools)
          POOLID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$POOL")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6资源入池"}' http://localhost:8080/api/admin/v1/resource-pools/$POOLID/recalculate >/dev/null
          MEMBERS=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/resource-pools/$POOLID/ips?page=1&size=20")
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["total"]==2' <<< "$MEMBERS"

          echo '--- M5 short/exclusive products ---'
          SHORT=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-M6-SHORT","productName":"M6短效IP","productType":"SHORT_IP","accessModeCode":"API_EXTRACT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"description":"M6","typeConfig":{"ipValidSeconds":60,"singleExtractLimit":10,"extractRateLimit":100,"extractRateWindowSeconds":60,"dedupPeriodSeconds":300,"whitelistRequired":true,"switchPolicy":{}}}' http://localhost:8080/api/admin/v1/products)
          SHORTID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$SHORT")
          EXC=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-M6-EXC","productName":"M6独享IP","productType":"EXCLUSIVE_IP","accessModeCode":"DIRECT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN"],"resourceMode":"EXCLUSIVE","regionCodes":[],"carrierCodes":[],"description":"M6","typeConfig":{"exclusiveResourceType":"IP","resourceCountDefault":1,"lockTimeoutSeconds":300,"replacementRule":{},"releaseRule":{}}}' http://localhost:8080/api/admin/v1/products)
          EXCID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$EXC")
          make_strategy(){ PID=$1; CODE=$2; S=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"strategyCode\":\"$CODE-ST\",\"strategyName\":\"$CODE策略\",\"productId\":$PID,\"dispatchMode\":\"QUALITY_FIRST\",\"sourcePriority\":[\"SELF\"],\"regionCodes\":[],\"carrierCodes\":[],\"poolBindings\":[{\"poolId\":$POOLID,\"priority\":10,\"weight\":100,\"enabled\":true}],\"scopes\":[],\"failoverRule\":{},\"ipHoldRule\":{},\"switchRule\":{}}" http://localhost:8080/api/admin/v1/resource-strategies); SID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$S"); curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6验证"}' http://localhost:8080/api/admin/v1/resource-strategies/$SID/validate >/dev/null; curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6启用策略"}' http://localhost:8080/api/admin/v1/resource-strategies/$SID/enable >/dev/null; curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6启用产品"}' http://localhost:8080/api/admin/v1/products/$PID/enable >/dev/null; }
          make_strategy "$SHORTID" CI-M6-SHORT
          make_strategy "$EXCID" CI-M6-EXC
          PK=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"packageCode\":\"CI-M6-PK\",\"productId\":$SHORTID,\"packageName\":\"M6短效30天\",\"serviceDays\":30,\"extractQuota\":10000,\"concurrencyLimit\":20,\"whitelistLimit\":10,\"price\":99.00,\"currency\":\"CNY\",\"quotaConfig\":{}}" http://localhost:8080/api/admin/v1/packages)
          PKID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PK")

          echo '--- M6 order create/confirm/provision ---'
          ORDER=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"customerId\":$CID,\"orderType\":\"NEW\",\"currency\":\"CNY\",\"remark\":\"M6 lifecycle\",\"items\":[{\"productId\":$SHORTID,\"packageId\":$PKID,\"quantity\":1,\"serviceCount\":1},{\"productId\":$EXCID,\"packageId\":null,\"quantity\":1,\"serviceCount\":1}]}" http://localhost:8080/api/admin/v1/orders)
          OID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$ORDER")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6确认订单"}' http://localhost:8080/api/admin/v1/orders/$OID/confirm >/dev/null
          PROV=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6开通服务"}' http://localhost:8080/api/admin/v1/orders/$OID/provision)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert len(d["services"])==2 and all(x["status"]=="ACTIVE" for x in d["services"]) and all(x["oneTimeCredential"]["secret"] for x in d["services"])' <<< "$PROV"
          S1=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]["services"]; print(next(x["serviceId"] for x in d if x["oneTimeCredential"]["type"]=="TOKEN"))' <<< "$PROV")
          SL=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/services?page=1&size=20')
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["total"]==2' <<< "$SL"
          OD=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/orders/$OID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="PROVISIONED" and len(d["items"])==2' <<< "$OD"

          echo '--- M6 credential/whitelist/lifecycle ---'
          CREDS=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/services/$S1/credentials)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert len(d)==1 and d[0]["secret_mask"] and "secret_hash" not in d[0]' <<< "$CREDS"
          RESET=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6轮换凭证"}' http://localhost:8080/api/admin/v1/services/$S1/credentials/reset)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["secret"]' <<< "$RESET"
          W=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"ipAddress":"203.0.113.10","remark":"M6 CI"}' http://localhost:8080/api/admin/v1/services/$S1/whitelist)
          WID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$W")
          curl -fsS -H "$H" -X DELETE "http://localhost:8080/api/admin/v1/services/$S1/whitelist/$WID?reason=M6-CI" >/dev/null
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6暂停"}' http://localhost:8080/api/admin/v1/services/$S1/suspend >/dev/null
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6恢复"}' http://localhost:8080/api/admin/v1/services/$S1/resume >/dev/null
          RENEW=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"days":7,"reason":"M6续费"}' http://localhost:8080/api/admin/v1/services/$S1/renew)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["expireAt"]' <<< "$RENEW"

          echo '--- M6 terminate/release/exclusive recycle ---'
          EXCSVC=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]["services"]; print(next(x["serviceId"] for x in d if x["serviceId"]!='$S1'))' <<< "$PROV")
          TERM=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M6终止独享服务"}' http://localhost:8080/api/admin/v1/services/$EXCSVC/terminate)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["status"]=="SUCCESS"' <<< "$TERM"
          REL=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/service-releases?page=1&size=20')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]>=1 and d["items"][0]["status"]=="SUCCESS"' <<< "$REL"
          EXA=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/exclusive-allocations?page=1&size=20')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert any(x["status"]=="PENDING_RECYCLE" for x in d["items"])' <<< "$EXA"
          curl -fsS -H "$H" http://localhost:8080/api/admin/v1/system/operation-logs >/dev/null
      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock-only && npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
