name: M8 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ip_proxy
          POSTGRES_USER: ipproxy
          POSTGRES_PASSWORD: ipproxy_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ipproxy -d ip_proxy"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Validate M3-M8 lifecycle
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ip_proxy
          DB_USER: ipproxy
          DB_PASSWORD: ipproxy_dev
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-m8-secret-key-with-more-than-32-bytes-123456
          M1_ADMIN_PASSWORD: admin123
          SPRING_PROFILES_ACTIVE: m4-mock,m6-mock,m8-mock
          MONITOR_SCHEDULED_ENABLED: 'false'
          STATISTICS_SCHEDULED_ENABLED: 'false'
        run: |
          set -euo pipefail
          java -jar backend/target/ip-proxy-platform-backend.jar > /tmp/backend.log 2>&1 &
          for i in {1..60}; do curl -fsS http://localhost:8080/actuator/health >/dev/null && break || sleep 2; done
          curl -fsS http://localhost:8080/actuator/health >/dev/null
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}' http://localhost:8080/api/admin/v1/auth/login)
          TOKEN=$(python3 -c 'import json,sys; d=json.load(sys.stdin); p=d["data"]["user"]["permissions"]; need=["customer:access","resource:access","product:access","order-service:access","runtime-log:access","runtime-log:extract:read","runtime-log:api:read","monitor:access","monitor:read","monitor:collect","alarm:access","alarm:read","alarm:rule:write","alarm:handle","alarm:notification:read","statistics:access","statistics:read","statistics:recalculate"]; assert all(x in p for x in need); print(d["data"]["accessToken"])' <<< "$LOGIN")
          H="Authorization: Bearer $TOKEN"

          echo '--- M3 customer/account ---'
          C=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"customerName":"M8全链路客户","customerTypeCode":"ENTERPRISE","contactName":"CI","contactPhone":"13800000000","contactEmail":"m8@example.com","remark":"M8 smoke"}' http://localhost:8080/api/admin/v1/customers)
          CID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$C")
          ACCOUNT=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"customerId\":$CID,\"username\":\"m8-ci\",\"password\":\"M8-Ci-Password-123!\",\"accountTypeCode\":\"DEFAULT\"}" http://localhost:8080/api/admin/v1/customer-accounts)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["id"]>0' <<< "$ACCOUNT"

          echo '--- M4 resources and pool ---'
          for P in centos ros lines ips; do curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8资源准备"}' http://localhost:8080/api/admin/v1/resources/$P/sync >/dev/null; done
          POOL=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"poolCode":"CI-M8-POOL","poolName":"M8统一资源池","purpose":"M8 lifecycle","regionCodes":[],"carrierCodes":[],"sourceScope":"MIXED","admissionRule":{},"detectionRule":{},"dedupRule":{},"priority":10}' http://localhost:8080/api/admin/v1/resource-pools)
          POOLID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$POOL")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8资源入池"}' http://localhost:8080/api/admin/v1/resource-pools/$POOLID/recalculate >/dev/null
          MEMBERS=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/resource-pools/$POOLID/ips?page=1&size=20")
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["total"]==2' <<< "$MEMBERS"

          echo '--- M5 products ---'
          SHORT=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-M8-SHORT","productName":"M8短效IP","productType":"SHORT_IP","accessModeCode":"API_EXTRACT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN"],"resourceMode":"SHARED","regionCodes":[],"carrierCodes":[],"description":"M8","typeConfig":{"ipValidSeconds":60,"singleExtractLimit":10,"extractRateLimit":100,"extractRateWindowSeconds":60,"dedupPeriodSeconds":300,"whitelistRequired":true,"switchPolicy":{}}}' http://localhost:8080/api/admin/v1/products)
          SHORTID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$SHORT")
          EXC=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"productCode":"CI-M8-EXC","productName":"M8独享IP","productType":"EXCLUSIVE_IP","accessModeCode":"DIRECT","protocolCodes":["HTTP"],"authModeCodes":["TOKEN"],"resourceMode":"EXCLUSIVE","regionCodes":[],"carrierCodes":[],"description":"M8","typeConfig":{"exclusiveResourceType":"IP","resourceCountDefault":1,"lockTimeoutSeconds":300,"replacementRule":{},"releaseRule":{}}}' http://localhost:8080/api/admin/v1/products)
          EXCID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$EXC")
          make_strategy(){ PID=$1; CODE=$2; S=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"strategyCode\":\"$CODE-ST\",\"strategyName\":\"$CODE策略\",\"productId\":$PID,\"dispatchMode\":\"QUALITY_FIRST\",\"sourcePriority\":[\"SELF\"],\"regionCodes\":[],\"carrierCodes\":[],\"poolBindings\":[{\"poolId\":$POOLID,\"priority\":10,\"weight\":100,\"enabled\":true}],\"scopes\":[],\"failoverRule\":{},\"ipHoldRule\":{},\"switchRule\":{}}" http://localhost:8080/api/admin/v1/resource-strategies); SID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$S"); curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8验证"}' http://localhost:8080/api/admin/v1/resource-strategies/$SID/validate >/dev/null; curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8启用策略"}' http://localhost:8080/api/admin/v1/resource-strategies/$SID/enable >/dev/null; curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8启用产品"}' http://localhost:8080/api/admin/v1/products/$PID/enable >/dev/null; }
          make_strategy "$SHORTID" CI-M8-SHORT
          make_strategy "$EXCID" CI-M8-EXC
          PK=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"packageCode\":\"CI-M8-PK\",\"productId\":$SHORTID,\"packageName\":\"M8短效30天\",\"serviceDays\":30,\"extractQuota\":10000,\"concurrencyLimit\":20,\"whitelistLimit\":10,\"price\":99.00,\"currency\":\"CNY\",\"quotaConfig\":{}}" http://localhost:8080/api/admin/v1/packages)
          PKID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$PK")

          echo '--- M6 order/service lifecycle ---'
          ORDER=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d "{\"customerId\":$CID,\"orderType\":\"NEW\",\"currency\":\"CNY\",\"remark\":\"M8 lifecycle\",\"items\":[{\"productId\":$SHORTID,\"packageId\":$PKID,\"quantity\":1,\"serviceCount\":1},{\"productId\":$EXCID,\"packageId\":null,\"quantity\":1,\"serviceCount\":1}]}" http://localhost:8080/api/admin/v1/orders)
          OID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$ORDER")
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8确认订单"}' http://localhost:8080/api/admin/v1/orders/$OID/confirm >/dev/null
          PROV=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8开通服务"}' http://localhost:8080/api/admin/v1/orders/$OID/provision)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert len(d["services"])==2 and all(x["status"]=="ACTIVE" for x in d["services"])' <<< "$PROV"
          SL=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/services?page=1&size=20')
          S1=$(python3 -c "import json,sys; d=json.load(sys.stdin)['data']['items']; print(next(x['id'] for x in d if x['product_id']==$SHORTID))" <<< "$SL")
          EXCSVC=$(python3 -c "import json,sys; d=json.load(sys.stdin)['data']['items']; print(next(x['id'] for x in d if x['product_id']==$EXCID))" <<< "$SL")
          TERM=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8终止独享服务"}' http://localhost:8080/api/admin/v1/services/$EXCSVC/terminate)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["status"]=="SUCCESS"' <<< "$TERM"

          echo '--- M7 Open API token/extract/whitelist ---'
          OA1=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"m8-ci","password":"M8-Ci-Password-123!","changeToken":false}' http://localhost:8080/api/open/v1/auth/token)
          OPEN1=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["token"] and d["serviceNo"]; print(d["token"])' <<< "$OA1")
          OA1B=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"m8-ci","password":"M8-Ci-Password-123!","changeToken":false}' http://localhost:8080/api/open/v1/auth/token)
          OPEN1B=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["token"])' <<< "$OA1B")
          test "$OPEN1" = "$OPEN1B"
          EXT1=$(curl -fsS -H "Authorization: Bearer $OPEN1" 'http://localhost:8080/api/open/v1/proxy/extract?amount=1&protocol=HTTP')
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["data"]["count"]==1 and d["data"]["quotaTotal"]==10000' <<< "$EXT1"
          RID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["requestId"])' <<< "$EXT1")
          EL=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/runtime-logs/ip-extract?keyword=$RID")
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==1' <<< "$EL"
          AL=$(curl -fsS -H "$H" "http://localhost:8080/api/admin/v1/runtime-logs/api?keyword=$RID")
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert any(x["path"]=="/api/open/v1/proxy/extract" for x in d["items"])' <<< "$AL"
          W=$(curl -fsS -H "Authorization: Bearer $OPEN1" -H 'Content-Type: application/json' -d '{"ip":"203.0.113.20"}' http://localhost:8080/api/open/v1/whitelist)
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["ip"]=="203.0.113.20"' <<< "$W"
          curl -fsS -X DELETE -H "Authorization: Bearer $OPEN1" http://localhost:8080/api/open/v1/whitelist/203.0.113.20 >/dev/null
          OA2=$(curl -fsS -H 'Content-Type: application/json' -d '{"username":"m8-ci","password":"M8-Ci-Password-123!","changeToken":true}' http://localhost:8080/api/open/v1/auth/token)
          OPEN2=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["changed"] is True; print(d["token"])' <<< "$OA2")
          test "$OPEN1" != "$OPEN2"
          OLD_STATUS=$(curl -s -o /tmp/m8-old-token.json -w '%{http_code}' -H "Authorization: Bearer $OPEN1" 'http://localhost:8080/api/open/v1/proxy/extract?amount=1')
          test "$OLD_STATUS" = "400"
          python3 -c 'import json; assert json.load(open("/tmp/m8-old-token.json"))["code"]=="OPEN_TOKEN_EXPIRED"'
          EXT2=$(curl -fsS -H "Authorization: Bearer $OPEN2" 'http://localhost:8080/api/open/v1/proxy/extract?amount=1')
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["count"]==1' <<< "$EXT2"
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8验证Token随服务暂停失效"}' http://localhost:8080/api/admin/v1/services/$S1/suspend >/dev/null
          PAUSE_STATUS=$(curl -s -o /tmp/m8-paused.json -w '%{http_code}' -H "Authorization: Bearer $OPEN2" 'http://localhost:8080/api/open/v1/proxy/extract?amount=1')
          test "$PAUSE_STATUS" = "400"
          python3 -c 'import json; assert json.load(open("/tmp/m8-paused.json"))["code"]=="OPEN_SERVICE_NOT_ACTIVE"'
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"reason":"M8恢复服务"}' http://localhost:8080/api/admin/v1/services/$S1/resume >/dev/null
          ALL_EXTRACT=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/runtime-logs/ip-extract?page=1&size=50')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]>=2 and sum(1 for x in d["items"] if x["result"]=="SUCCESS")>=2' <<< "$ALL_EXTRACT"
          ALL_API=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/runtime-logs/api?page=1&size=100')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert any(x["result"]=="FAILURE" for x in d["items"])' <<< "$ALL_API"
          USAGE=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/runtime-logs/usage?page=1&size=20')
          python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["total"]==0' <<< "$USAGE"

          echo '--- M8 alarm rule + monitor collection ---'
          RULE=$(curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"ruleCode":"CI-M8-LINE-LATENCY","ruleName":"M8线路探测延迟告警","objectType":"LINE","metricCode":"ACTIVE_PROBE_LATENCY_MS","operator":"GT","threshold":40,"durationSeconds":0,"consecutiveCount":1,"severity":"MAJOR","notificationChannels":["PLATFORM","DINGTALK"],"notifyRecovery":true,"repeatIntervalSeconds":3600}' http://localhost:8080/api/admin/v1/alarms/rules)
          RULEID=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="ACTIVE"; print(d["id"])' <<< "$RULE")
          COLLECT1=$(curl -fsS -X POST -H "$H" 'http://localhost:8080/api/admin/v1/monitor/collect?triggerType=CI')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="SUCCESS" and d["objectCount"]>=9 and d["sampleCount"]>0 and d["alarmTriggerCount"]==1' <<< "$COLLECT1"
          MON=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/monitor/objects?objectType=LINE&page=1&size=20')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2 and all(not x["stale"] for x in d["items"])' <<< "$MON"
          AOPEN=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/alarms?status=OPEN&page=1&size=20')
          ALARMID=$(python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==1; x=d["items"][0]; assert x["metric_code"]=="ACTIVE_PROBE_LATENCY_MS" and x["occurrence_count"]==1; print(x["id"])' <<< "$AOPEN")
          NOTIFY=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/alarms/notifications?page=1&size=20')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["total"]==2; assert {x["channel"] for x in d["items"]}=={"PLATFORM","DINGTALK"}; assert all(x["result"]=="SUCCESS" for x in d["items"])' <<< "$NOTIFY"

          echo '--- M8 alarm acknowledge/process/dedup ---'
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"remark":"M8 CI确认"}' http://localhost:8080/api/admin/v1/alarms/$ALARMID/acknowledge >/dev/null
          curl -fsS -H "$H" -H 'Content-Type: application/json' -d '{"remark":"M8 CI开始处理"}' http://localhost:8080/api/admin/v1/alarms/$ALARMID/process >/dev/null
          COLLECT2=$(curl -fsS -X POST -H "$H" 'http://localhost:8080/api/admin/v1/monitor/collect?triggerType=CI')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["alarmTriggerCount"]==0 and d["alarmRecoveryCount"]==0' <<< "$COLLECT2"
          AD=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/alarms/$ALARMID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="PROCESSING" and d["occurrence_count"]>=2; actions={x["action"] for x in d["processes"]}; assert "ACKNOWLEDGE" in actions and "START_PROCESS" in actions; assert len(d["notifications"])==2' <<< "$AD"

          echo '--- M8 automatic recovery + recovery notifications ---'
          curl -fsS -X PUT -H "$H" -H 'Content-Type: application/json' -d '{"threshold":100}' http://localhost:8080/api/admin/v1/alarms/rules/$RULEID >/dev/null
          COLLECT3=$(curl -fsS -X POST -H "$H" 'http://localhost:8080/api/admin/v1/monitor/collect?triggerType=CI')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["alarmRecoveryCount"]==1' <<< "$COLLECT3"
          ADR=$(curl -fsS -H "$H" http://localhost:8080/api/admin/v1/alarms/$ALARMID)
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="RECOVERED"; assert any(x["action"]=="RECOVER" for x in d["processes"]); assert len(d["notifications"])==4 and sum(1 for x in d["notifications"] if x["channel"]=="DINGTALK" and x["result"]=="SUCCESS")==2' <<< "$ADR"

          echo '--- M8 hourly statistics ---'
          STAT=$(curl -fsS -X POST -H "$H" 'http://localhost:8080/api/admin/v1/statistics/recalculate?triggerType=CI')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["status"]=="SUCCESS" and d["resourceRows"]==1 and d["ipRows"]==1 and d["customerUsageRows"]>=1 and d["productServiceRows"]>=1' <<< "$STAT"
          RS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/statistics/resources')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d and d[-1]["centos_total"]==2 and d[-1]["ros_total"]==2 and d[-1]["line_total"]==2' <<< "$RS"
          IPS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/statistics/ips')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d and d[-1]["ip_total"]>=2 and d[-1]["ip_available"]>=2' <<< "$IPS"
          CS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/statistics/customers')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert any(x["service_id"]=='"$S1"' and x["extract_count"]>=2 and x["request_count"]==0 for x in d)' <<< "$CS"
          PS=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/statistics/products')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert any(x["product_id"]=='"$SHORTID"' and x["active_service_count"]>=1 and x["extract_count"]>=2 for x in d)' <<< "$PS"
          DASH=$(curl -fsS -H "$H" 'http://localhost:8080/api/admin/v1/dashboard/overview')
          python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; assert d["active_customers"]==1 and d["active_services"]==1 and d["today_returned_ips"]>=2 and d["online_centos"]==2 and d["online_ros"]==2 and d["online_lines"]==2 and d["active_alarms"]==0' <<< "$DASH"

      - name: Print backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock-only && npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
