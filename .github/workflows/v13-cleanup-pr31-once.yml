name: One-time cleanup merged A1 PR31 branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-cleanup-pr31-once.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete exact merged PR31 branch with ancestor check
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/v13-a1-provision-route-persistence-20261016'
          expected='3e11f1fb0a538050892fccddd1b51cc1868e092d'
          current="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [[ -z "${current}" ]]; then echo 'Already absent'; exit 0; fi
          if [[ "${current}" != "${expected}" ]]; then
            echo "::error::Branch head moved; do not delete"; exit 1
          fi
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${current}" "${GITHUB_SHA}"; then
            echo "::error::Not fully included in main; do not delete"; exit 1
          fi
          git push --force-with-lease="refs/heads/${branch}:${current}" origin ":refs/heads/${branch}"
          echo "DELETED merged A1 PR31 branch ${branch}"
