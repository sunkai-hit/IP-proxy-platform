name: One-time stale branch pruning (V1.3 A-stage)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-prune-merged-branches-once.yml'
permissions:
  contents: write
jobs:
  prune:
    if: startsWith(github.event.head_commit.message, 'Merge A-stage safe branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Delete only verified main-ancestor branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          branches=(
          'design/v1.2-p1-page-field-interaction-audit-20261014'
          'feature/v1.2-full-upgrade'
          'feature/v1.2-round3-unified-baseline-20261014'
          'feature/v12-two-team-engineering-convergence-20261015'
          'fix/v13-a2-a5-release-alarm-drilldown-20261016'
          'fix/v13-a2-a5-snapshot-safety-20261016'
          'fix/v13-a-p0-purchase-proxy-list-reliability-20261016'
          'fix/v13-a-phase-acceptance-closeout-20261016'
          'fix/v13-consolidation-batch-20261016'
          'fix/v13-detail-action-safety-closeout-20261016'
          'fix/v13-document-api-baseline-split-20261016'
          'fix/v13-ops-observability-convergence-20261016'
          'fix/v13-product-purchase-detail-convergence-20261016'
          'fix/v13-product-snapshot-freshness-20261016'
          'fix/v13-provision-preview-and-api-contract-audit-20261016'
          'fix/v13-release-receipt-binding-20261016'
          'fix/v13-resource-sync-customer-console-closeout-20261016'
          'fix/v13-service-order-ux-closeout-20261016'
          'chore/v13-a-acceptance-branch-prune-20261016'
          )
          for branch in "${branches[@]}"; do
            current="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
            if [[ -z "${current}" ]]; then
              echo "SKIP already absent: ${branch}"
              continue
            fi
            git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
            if ! git merge-base --is-ancestor "${current}" "${GITHUB_SHA}"; then
              echo "::error::Branch is not an ancestor of main; preserving ${branch}: ${current}"
              exit 1
            fi
            git push --force-with-lease="refs/heads/${branch}:${current}" origin ":refs/heads/${branch}"
            echo "DELETED historical branch: ${branch}"
          done
      - name: Archive then delete superseded unmerged PR 18 branch
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/v13-ops-workflow-p0-closeout-20261016'
          expected='3d2dc89d0b12ac19ceda034bc48d2c671d31b024'
          archive='archive/v13-pr18-closed-unmerged-20261016'
          current="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          if [[ -z "${current}" ]]; then
            echo "SKIP: special branch already absent"
            exit 0
          fi
          if [[ "${current}" != "${expected}" ]]; then
            echo "::error::Unmerged branch has changed; cannot archive/delete automatically."
            exit 1
          fi
          if [[ -n "$(git ls-remote origin "refs/tags/${archive}" | cut -f1)" ]]; then
            echo "::error::Archive tag exists; protect it from overwrite."
            exit 1
          fi
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${archive}" "${current}" -m 'Archive closed unmerged PR #18 before deleting historical branch; reconciled by PR #17/#19'
          git push origin "refs/tags/${archive}"
          git push --force-with-lease="refs/heads/${branch}:${current}" origin ":refs/heads/${branch}"
          echo "ARCHIVED: ${branch} -> tag ${archive} (${current}); DELETED special branch."
