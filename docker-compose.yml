services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ip_proxy}
      POSTGRES_USER: ${POSTGRES_USER:-ipproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipproxy_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipproxy} -d ${POSTGRES_DB:-ip_proxy}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ip_proxy}
      DB_USER: ${POSTGRES_USER:-ipproxy}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ipproxy_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-this-m1-dev-secret-key-please-32bytes-minimum}
      M1_ADMIN_USERNAME: ${M1_ADMIN_USERNAME:-admin}
      M1_ADMIN_PASSWORD: ${M1_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
