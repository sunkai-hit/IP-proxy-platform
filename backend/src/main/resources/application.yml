server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: ip-proxy-platform-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ip_proxy}
    username: ${DB_USER:ipproxy}
    password: ${DB_PASSWORD:ipproxy_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: when_authorized
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
app:
  jwt:
    secret: ${JWT_SECRET:change-this-m1-dev-secret-key-please-32bytes-minimum}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  bootstrap:
    admin-enabled: ${APP_BOOTSTRAP_ADMIN:true}
    admin-username: ${M1_ADMIN_USERNAME:admin}
    admin-password: ${M1_ADMIN_PASSWORD:admin123}
    admin-display-name: ${M1_ADMIN_DISPLAY_NAME:超级管理员}
  monitor:
    scheduled-enabled: ${MONITOR_SCHEDULED_ENABLED:true}
    collect-interval-ms: ${MONITOR_COLLECT_INTERVAL_MS:60000}
    initial-delay-ms: ${MONITOR_INITIAL_DELAY_MS:15000}
    stale-seconds: ${MONITOR_STALE_SECONDS:300}
  alarm:
    dingtalk-webhook: ${DINGTALK_WEBHOOK_URL:}
  statistics:
    scheduled-enabled: ${STATISTICS_SCHEDULED_ENABLED:true}
    cron: ${STATISTICS_CRON:0 5 * * * *}
